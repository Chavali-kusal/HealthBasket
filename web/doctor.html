function dock(){if(['submit','review','success','login'].includes(page))return '';const active=page==='detail'?'patients':['qr','security','documents'].includes(page)?'profile':['offers','shopping'].includes(page)?'home':page;return `<nav class="dock" aria-label="Doctor app navigation">${[['home','Home'],['patients','Patients'],['wallet','Wallet'],['reports','Reports'],['profile','Profile']].map(([p,l])=>`<button class="${active===p?'active':''}" data-action="${p}" ${active===p?'aria-current="page"':''} aria-label="${l}">${I(p)}<span>${l}</span></button>`).join('')}</nav>`}
function patientCard(r){return `<button class="patient" data-action="detail" data-id="${E(r.id)}"><div class="patient-top"><span class="initial">${E(r.name[0])}</span><div class="patient-meta"><h3>${E(r.name)}</h3><p>${E(hospital(r.hospitalId).name)}</p></div>${I('arrow')}</div><div class="patient-bottom">${badge(r)}<time>${date(r.created)}</time><strong>${r.confirmed?money(r.confirmed):'Awaiting amount'}</strong></div></button>`}
function home(){const rows=db.referrals;return `<section class="home-content"><section class="greet"><p>Hello,</p><h1>${E(db.profile.name)} <span class="wave" aria-label="Welcome"><svg viewBox="0 0 24 24" fill="#f8dfc0" stroke="#d6b996" stroke-width="1.1" style="width:26px;height:26px;vertical-align:middle;transform:rotate(-12deg)"><path d="M7 12V6a1.5 1.5 0 0 1 3 0v5-7a1.5 1.5 0 0 1 3 0v7-6a1.5 1.5 0 0 1 3 0v7-4a1.5 1.5 0 0 1 3 0v8a7 7 0 0 1-12 5l-4-5a1.6 1.6 0 0 1 2.5-2l2 2Z"/></svg></span></h1><div class="greet-bottom"><span class="sub" style="margin:0">Your care workspace.</span></div></section><div class="service-grid">${[['submit','plus','blue','Refer a patient','Connect someone to care'],['patients','patients','teal','My patients',rows.length+' referrals · one place'],['wallet','wallet','peach','My earnings',money(sum(rows,'paid'))+' received'],['reports','reports','purple','Practice reports','Your activity at a glance'],['offers','gift','rose','Offers','Shopping, music & everyday perks'],['shopping','bag','mint','Shopping','Shopping, insurance & finance']].map(([p,i,c,t,d])=>`<button class="service" data-action="${p}"><span class="service-icon ${c}">${I(i)}</span><b>${t}</b><small>${d}</small></button>`).join('')}</div><button class="strip" data-action="qr"><span>${I('qr')}</span><div><b>Your referral QR</b><small>Patient intake, connected to your Doctor ID</small></div>${I('arrow')}</button><div class="home-overview"><button data-action="patients"><b>${rows.filter(r=>['submitted','follow_up'].includes(r.status)).length}</b><span>In follow-up</span></button><button data-action="patients"><b>${rows.filter(r=>stages.indexOf(r.status)>=2).length}</b><span>Admissions</span></button><button data-action="wallet"><b>${rows.filter(canClaim).length}</b><span>Ready to claim</span></button></div></section>`}
function match(r){const text=(r.name+' '+r.id+' '+hospital(r.hospitalId).name).toLowerCase();return text.includes(query.toLowerCase())&&(filter==='all'||filter==='pending'&&['submitted','follow_up'].includes(r.status)||filter==='admitted'&&stages.indexOf(r.status)>=2||filter==='claim'&&canClaim(r)||filter==='paid'&&r.status==='paid')}
function pills(context){return [['all',context==='home'?'For you':'All patients'],['pending','Follow-up'],['admitted','Admitted'],['claim','To claim'],['paid','Paid']].map(([v,l])=>`<button class="pill ${filter===v?'active':''}" data-action="filter" data-value="${v}" aria-pressed="${filter===v}">${l}</button>`).join('')}

function patients(){return `<div class="page-head"><span class="eyebrow">YOUR CARE NETWORK</span><h1>Every patient matters.</h1><p>Follow their journey, from referral to admission.</p></div><button class="primary" data-action="submit">${I('plus')} Refer a patient</button><div class="heading"><h2>${db.referrals.length} referrals</h2><span class="demo-label">DEMO DATA</span></div><div class="search">${I('search')}<input id="patient-search" type="search" placeholder="Search patient, hospital or referral ID" aria-label="Search patients"></div><div class="pills">${pills('patients')}</div><div id="patient-list">${db.referrals.filter(match).map(patientCard).join('')||empty('No matching patients','Try a different search or category.')}</div>${footer()}`}
function submit(){const hospitalId=draft.hospitalId||'';return `<div class="page-head"><span class="eyebrow">START A CARE JOURNEY</span><h1>Refer a patient.</h1><p>Choose the hospital. Share the details.<br>We’ll keep the journey together.</p></div><form id="referral-form"><section class="form-section"><h2><span>1</span> Hospital & referral</h2><label>Hospital <span aria-hidden="true">*</span><select name="hospitalId" id="hospital-choice" required><option value="">Choose a hospital</option>${hospitals.map(h=>`<option value="${h.id}" ${hospitalId===h.id?'selected':''}>${E(h.name)} · ${E(h.city)}</option>`).join('')}</select></label><div id="hospital-mapping">${hospitalMapping(hospitalId)}</div><div class="mapping"><span>Doctor ID · ${E(db.profile.id)}</span><span>Referral ID · generated on submit</span></div></section><section class="form-section"><h2><span>2</span> Patient details</h2><div class="form-grid"><label class="full">Full name *<input name="name" maxlength="80" autocomplete="name" placeholder="Patient’s full name" value="${E(draft.name||'')}" required></label><label class="full">Mobile number *<input name="phone" type="tel" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" placeholder="10-digit mobile number" value="${E(draft.phone||'')}" required></label><label>Age<input name="age" type="number" min="0" max="120" placeholder="Years" value="${E(draft.age||'')}"></label><label>Gender<select name="gender"><option value="">Select</option>${['Female','Male','Other','Prefer not to say'].map(g=>`<option ${draft.gender===g?'selected':''}>${g}</option>`).join('')}</select></label><label class="full">Problem / specialty *<input name="problem" maxlength="120" placeholder="e.g. Cardiology consultation" value="${E(draft.problem||'')}" required></label><label class="full">Referral note<textarea name="note" maxlength="800" placeholder="Anything the hospital team should know?">${E(draft.note||'')}</textarea></label></div></section><label class="consent"><input type="checkbox" name="consent" required ${draft.consent?'checked':''}><span>I have the patient’s consent to share these details with the selected hospital for treatment coordination.</span></label><button class="primary" type="submit">Review referral ${I('arrow')}</button><p class="fineprint">Demo only. No patient data is sent to a hospital. Details stay in this browser.</p></form>`}
function hospitalMapping(id){if(!id)return '';const h=hospital(id);return `<div class="hospital-card">${I('hospital')}<div><b>${E(h.name)}</b><p>${E(h.city)} · ${E(h.team)}</p></div></div><div class="mapping"><span>Hospital ID · ${E(h.id)}</span></div>`}
function review(){if(!draft.hospitalId)return submit();return `<div class="page-head"><span class="eyebrow">ONE LAST LOOK</span><h1>Ready to refer?</h1><p>Check these details before submitting.</p></div><section class="summary-card"><h2>Patient details</h2>${kv('Patient',draft.name)+kv('Mobile',draft.phone)+kv('Age / Gender',(draft.age||'—')+' / '+(draft.gender||'—'))+kv('Problem',draft.problem)}${draft.note?kv('Note',draft.note):''}</section><section class="summary-card"><h2>Referral mapping</h2>${kv('Hospital',hospital(draft.hospitalId).name)+kv('Hospital ID',draft.hospitalId)+kv('Submitting doctor',db.profile.name)+kv('Doctor ID',db.profile.id)}</section><div class="info-box">${I('bell')} Your submission and hospital notification will be recorded as a demo transaction. No real notification will be sent.</div><button class="primary" data-action="confirm-submit">${I('send')} Submit patient referral</button><button class="secondary" style="margin-top:12px" data-action="edit-referral">Edit details</button>`}

function success(){const r=db.referrals.find(x=>x.id===selected);return `<div class="success-state" style="padding-top:35px"><div class="success-art">${I('check')}</div><span class="eyebrow">A NEW CARE JOURNEY</span><h1>Referral submitted.</h1><p>${E(r.name)} is now in your patient list.<br>Hospital notification recorded in demo.</p><section class="summary-card" style="text-align:left">${kv('Referral ID',r.id)+kv('Hospital',hospital(r.hospitalId).name)+kv('Status','Submitted')}</section><button class="primary" data-action="detail" data-id="${E(r.id)}">Track this referral ${I('arrow')}</button><button class="secondary" style="margin-top:12px" data-action="home">Back to Home</button><p class="fineprint">Your demo data stays in this browser. No actual notifications were delivered.</p></div>`}
function detail(){const r=db.referrals.find(x=>x.id===selected);if(!r)return empty('Referral not found','Choose a patient to view their details.');return `<section class="detail-person"><div class="initial">${E(r.name[0])}</div><h1>${E(r.name)}</h1><p>${E(hospital(r.hospitalId).name)}</p>${badge(r)}<p>${E(r.id)} · ${date(r.created)}</p></section><div class="money-grid"><div><span>Hospital confirmed</span><b>${money(r.confirmed)}</b></div><div><span>Doctor claimed</span><b>${money(r.claimed)}</b></div><div><span>Claim approved</span><b>${money(r.approved)}</b></div><div class="green"><span>Payment received</span><b>${money(r.paid)}</b></div></div><div class="summary-card" style="margin-top:0">${kv('Confirmed balance',money(Math.max(0,r.confirmed-r.paid)))+kv('Approved, awaiting payment',money(Math.max(0,r.approved-r.paid)))}</div>${canClaim(r)?`<button class="primary" data-action="claim" data-id="${E(r.id)}">${I('wallet')} Claim ${money(r.confirmed)}</button>`:''}<button class="secondary" data-action="record-documents" data-id="${E(r.id)}">View recorded-event documents</button><div class="summary-card"><h2>Referral journey</h2><ol class="timeline">${r.timeline.slice().reverse().map(t=>`<li><b>${E(t.title)}</b><p>${E(t.note)}</p><small>${E(t.actor)} · ${stamp(t.at)}</small></li>`).join('')}</ol></div><div class="summary-card"><h2>Patient & hospital</h2>${kv('Patient mobile',r.phone)+kv('Age / Gender',(r.age||'—')+' / '+(r.gender||'—'))+kv('Problem',r.problem)+kv('Note',r.note||'—')+kv('Hospital',hospital(r.hospitalId).name)+kv('Hospital ID',r.hospitalId)+kv('Doctor ID',r.doctorId)+kv('Source',r.source)}</div>${r.payments.length?`<div class="summary-card"><h2>Payment history</h2>${r.payments.map(paymentItem).join('')}</div>`:''}<button class="secondary" data-action="simulate" data-id="${E(r.id)}">Preview next hospital update · Demo</button><p class="fineprint">This is a Doctor-only prototype. The preview simulates an incoming update; it is not a Hospital Panel.</p>`}

function wallet(){const rows=db.referrals;const eligible=rows.filter(canClaim);const allPayments=rows.flatMap(r=>r.payments.map(p=>({...p,name:r.name}))).sort((a,b)=>b.at.localeCompare(a.at));return `<div class="page-head"><span class="eyebrow">YOUR CARE, RECOGNISED</span><h1>My wallet.</h1><p>Every claim. Every payment. Clearly tracked.</p></div><div class="wallet-hero"><small>TOTAL RECEIVED · DEMO</small><h2>${money(sum(rows,'paid'))}</h2><p>Commission payments recorded in your ledger</p><div class="split"><span>Ready to claim · ${money(sum(eligible,'confirmed'))}</span><span>Pending payout · ${money(Math.max(0,sum(rows,'approved')-sum(rows,'paid')))}</span></div></div><div class="pills">${[['claims','To claim',eligible.length],['tracking','Claim tracker',rows.filter(r=>r.claimed).length],['payments','Payments',allPayments.length]].map(([v,l,n])=>`<button class="pill ${walletTab===v?'active':''}" data-action="wallet-tab" data-value="${v}">${l} · ${n}</button>`).join('')}</div>${walletTab==='claims'?(eligible.map(r=>`<div class="claim-card"><div class="patient-top"><span class="initial">${E(r.name[0])}</span><div class="patient-meta"><h3>${E(r.name)}</h3><p>${E(hospital(r.hospitalId).name)}</p></div><b style="font-size:13px">${money(r.confirmed)}</b></div><div class="claim-bottom"><span>Hospital amount confirmed</span><button class="small-btn" data-action="claim" data-id="${E(r.id)}">Claim now</button></div></div>`).join('')||empty('You’re all caught up','New hospital-confirmed amounts will be ready to claim here.')):walletTab==='tracking'?(rows.filter(r=>r.claimed).map(r=>`<button class="patient" data-action="detail" data-id="${E(r.id)}"><div class="patient-top"><span class="initial">${I('wallet')}</span><div class="patient-meta"><h3>${E(r.name)}</h3><p>${E(r.claimId)}</p></div><b style="font-size:12px">${money(r.claimed)}</b></div><div class="patient-bottom">${badge(r)}<strong>Paid ${money(r.paid)}</strong></div></button>`).join('')||empty('No claims yet','Submit function reports(){const rows=reportRows();const admitted=rows.filter(r=>stages.indexOf(r.status)>=2);const groups=hospitals.map(h=>({h,rows:rows.filter(r=>r.hospitalId===h.id)}));const buckets=Array.from({length:6},(_,i)=>{const d=new Date();d.setDate(d.getDate()-5+i);return {label:d.toLocaleDateString('en-IN',{weekday:'short'}),count:rows.filter(r=>new Date(r.created).toDateString()===d.toDateString()).length}});const max=Math.max(1,...buckets.map(b=>b.count));return `<div class="page-head"><span class="eyebrow">YOUR PRACTICE, AT A GLANCE</span><h1>A clearer picture.</h1><p>Referral activity and commission, together.</p></div><div class="report-date"><label>Submitted from<input id="report-from" type="date" value="${E(reportFrom)}"></label><label>Submitted to<input id="report-to" type="date" value="${E(reportTo)}"></label></div><div class="row-actions"><button class="secondary" data-action="apply-reports">Apply dates</button><button class="secondary" data-action="reset-reports">Reset</button></div><div class="stat-grid">${[['patients',rows.length,'Total referrals','Submitted patients'],['patients',admitted.length,'Admissions','Confirmed by hospital'],['wallet',money(sum(rows,'confirmed')),'Confirmed commission','Hospital-confirmed amount'],['wallet',money(sum(rows,'paid')),'Payment received','Recorded payments']].map(([p,n,l,s])=>`<button data-action="${p}"><small>${l}</small><b style="font-size:${String(n).length>8?'19':'25'}px">${n}</b><span>${s}</span></button>`).join('')}</div><div class="summary-card"><div class="heading" style="margin:0 0 8px"><h2>Referral activity</h2><span class="demo-label">LAST 6 DAYS</span></div><div class="bar-chart">${buckets.map(b=>`<div class="bar-col"><b>${b.count}</b><i style="height:${Math.max(5,b.count/max*82)}px"></i><span>${b.label}</span></div>`).join('')}</div></div><div class="summary-card"><h2>Commission summary</h2>${kv('Doctor claimed',money(sum(rows,'claimed')))+kv('Claims approved',money(sum(rows,'approved')))+kv('Approved pending payout',money(Math.max(0,sum(rows,'approved')-sum(rows,'paid'))))+kv('Confirmed balance',money(Math.max(0,sum(rows,'confirmed')-sum(rows,'paid'))))}</div><div class="heading"><h2>Hospital overview</h2></div>${groups.map(({h,rows:rr})=>`<div class="summary-card"><h2>${E(h.name)}</h2>${kv(h.id,rr.length+' referrals')+kv('Confirmed / Paid',money(sum(rr,'confirmed'))+' / '+money(sum(rr,'paid')))}</div>`).join('')}<button class="primary" data-action="export">${I('download')} Export transactions · CSV</button><p class="fineprint">Export uses the submission dates selected above. Demo ledger only.</p>`}

function claimSheet(id){const r=db.referrals.find(x=>x.id===id);if(!r||!canClaim(r)){toast('This referral is not ready for a new claim.');return}sheet('Claim your amount',`<p>${E(r.name)} · ${E(hospital(r.hospitalId).name)}</p><div class="summary-card">${kv('Confirmed amount',money(r.confirmed))+kv('Referral ID',r.id)}</div><form id="claim-form" data-id="${E(r.id)}"><label>Claim amount<input name="amount" type="number" min="1" step="1" max="${r.confirmed}" value="${r.confirmed}" required></label><label class="consent"><input type="checkbox" required><span>I confirm the referral details and request this amount for processing.</span></label><button class="primary" type="submit">Submit claim ${I('arrow')}</button><p class="fineprint">Demo request only. Claim approval and payment are separate steps.</p></form>`)}
function simulate(id){const r=db.referrals.find(x=>x.id===id);if(!r)return;let step=r.status;const options={submitted:['Hospital follow-up','Patient contacted by the hospital team.'],follow_up:['Confirm admission','Preview the hospital acknowledging admission.'],admitted:['Confirm commission','Set the commission amount confirmed by hospital.'],amount_confirmed:['Claim is ready','The next step belongs to you. Submit the Doctor claim.'],claim_submitted:['Approve claim','Preview Accounts approving the Doctor’s claim.'],claim_approved:['Record payment','Preview a released payment with a demo reference.'],part_paid:['Record balance payment','Preview a partial or final payment.'],paid:['Journey completed','The approved amount has been fully paid.']};const [title,text]=options[step];sheet('Incoming update · Demo',`<p>This simulates an external Hospital/Accounts update in your Doctor App. No Hospital Panel or real payment is involved.</p><div class="summary-card"><h2>${E(title)}</h2><p>${E(text)}</p>${kv('Patient',r.name)+kv('Current status',labels[r.status])}</div>${['paid','amount_confirmed'].includes(step)?`<button class="primary" data-action="${step==='amount_confirmed'?'claim':'close-sheet'}" data-id="${E(r.id)}">${step==='amount_confirmed'?'Submit Doctor claim':'Done'}</button>`:`<form id="simulate-form" data-id="${E(id)}">${['admitted','claim_submitted','claim_approved','part_paid'].includes(step)?`<label>${step==='admitted'?'Confirmed amount':step==='claim_submitted'?'Approved amount':'Payment amount'}<input name="amount" type="number" min="1" step="1" ${step==='admitted'?'':'max="'+(step==='claim_submitted'?r.claimed:r.approved-r.paid)+'"'} value="${step==='admitted'?2500:step==='claim_submitted'?r.claimed:r.approved-r.paid}" required></label>`:''}<button class="primary" style="margin-top:18px" type="submit">Apply demo update ${I('check')}</button></form>`}`)}
function recordUpdate(r,title,note){syncRewards(true);r.timeline.push({title,note,actor:'Hospital / Accounts · demo',at:new Date().toISOString()});notify(title,r.name+' · '+note,r.id,'check');save()}
app.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id,v=b.dataset.value;

if(a==='menu'){sheet('Your care workspace',`<p>HealthQR · Doctor Partner</p>${[['home','home','Home'],['submit','plus','Refer a patient'],['patients','patients','My patients'],['qr','qr','My referral QR'],['offers','gift','Offers & rewards'],['shopping','bag','Shopping & services'],['wallet','wallet','Claims & payments'],['reports','reports','Practice reports'],['profile','profile','My profile']].map(([a,i,l])=>`<button class="menu-item" data-action="${a}">${I(i)}<div><b>${l}</b></div>${I('arrow')}</button>`).join('')}`);return}

function exportCSV(){const columns=['Referral ID','Doctor ID','Hospital ID','Hospital Name','Patient Name','Patient Mobile','Problem','Submitted At','Status','Confirmed Amount','Claim ID','Claimed Amount','Approved Amount','Paid Amount','Confirmed Balance','Payment References'];const safe=v=>{let s=String(v??'');if(/^[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};const lines=[columns,...reportRows().map(r=>[r.id,r.doctorId,r.hospitalId,hospital(r.hospitalId).name,r.name,r.phone,r.problem,r.created,labels[r.status],r.confirmed,r.claimId||'',r.claimed,r.approved,r.paid,Math.max(0,r.confirmed-r.paid),r.payments.map(p=>p.reference).join('; ')])];const blob=new Blob(['\ufeff'+lines.map(row=>row.map(safe).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='HealthQR_Demo_Transactions_'+new Date().toISOString().slice(0,10)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Demo transaction report exported.');}

function syncRewards(announce=false){db.rewards=db.rewards||[];db.rewardCredits=db.rewardCredits||[];let changed=false;for(const r of db.referrals){if(stages.indexOf(r.status)<2||db.rewards.some(x=>x.referralId===r.id))continue;const checksum=[...r.id].reduce((a,c)=>a+c.charCodeAt(0),0);db.rewards.push({id:'REWARD-'+r.id,referralId:r.id,hospitalId:r.hospitalId,unlockedAt:admissionAt(r),revealed:false,redeemed:false,value:50+(checksum%5)*25});if(announce)notify('Admission reward unlocked',r.name+' · A demo scratch card is ready in Offers.',r.id,'gift');changed=true}if(changed)save()}

function oldShopping(){const credits=(db.rewards||[]).filter(r=>r.redeemed).reduce((n,r)=>n+r.value,0);const list=partners.filter(p=>shoppingCategory==='all'||p.category===shoppingCategory);return `<div class="page-head"><span class="eyebrow">DISCOVER A LITTLE MORE</span><h1>Shopping & services.</h1><p>A curated space for everyday possibilities.</p></div><div class="shopping-banner"><h2>Beyond your care journey.</h2><p>Shopping, insurance, finance and lifestyle categories. Browse the interface preview.</p></div><div class="reward-summary"><span>${I('gift')}</span><div><b>${money(credits)} demo shopping credits</b><small>Preview ledger only · not redeemable with partners</small></div><button data-action="reward-history">History</button></div><div class="category-chips">${[['all','For you'],['shopping','Shopping'],['insurance','Insurance'],['finance','Finance'],['wellness','Wellness'],['lifestyle','Lifestyle']].map(([v,l])=>`<button class="pill ${shoppingCategory===v?'active':''}" data-action="shopping-category" data-value="${v}">${l}</button>`).join('')}</div><div class="partner-grid">${list.map(p=>`<button class="partner-card" data-action="partner" data-id="${p.id}"><span class="partner-mark" style="color:${p.color};background:${p.bg}">${p.mark}</span><h3>${p.name}</h3><p>${p.desc}</p><span class="partner-foot">${p.action}${I('arrow')}</span></button>`).join('')}</div><p class="fineprint">Demo catalogue. Brand names identify external destinations; no partnership, live discount or financial offer is implied. No application or patient information is shared.</p>${footer()}`}

function newerVersion(a,b){const aa=a.split('.').map(Number),bb=b.split('.').map(Number);for(let i=0;i<3;i++){if(aa[i]>bb[i])return true;if(aa[i]<bb[i])return false}return false}
async function checkForUpdates(manual=false){if(updateChecking)return;updateChecking=true;try{let release;if(updateState.demoRelease)release=updateState.demoRelease;else if(location.protocol==='http:'||location.protocol==='https:'){const response=await fetch(new URL('version.json',location.href),{cache:'no-store'});if(!response.ok)throw new Error('metadata');release=await response.json()}else{if(manual)toast('This standalone file is up to date. Use Preview new version to test the prompt.');return}if(!/^\d+\.\d+\.\d+$/.test(release.version||''))throw new Error('version');if(!newerVersion(release.version,BUILD_VERSION)){if(manual)toast('You’re on the latest available version.');return}if(release.demo&&updateState.demoApplied===release.version){if(manual)toast('This demo update has already been previewed.');return}if(!manual&&updateState.promptedVersion===release.version)return;updateState.promptedVersion=release.version;updateState.available=release;saveUpdates();showUpdatePrompt(release)}catch(error){if(manual)toast('Update check unavailable. Your app is still ready to use.')}finally{updateChecking=false}}

function initMemberModel(){db.memberPerks=db.memberPerks||[];db.documents=db.documents||[];db.memberAudit=db.memberAudit||[];db.memberSecurity=db.memberSecurity||{twoStep:false,loginAlerts:true,lockMinutes:15,beneficiaryStatus:'demo_not_verified',beneficiary:'Not configured'};db.memberDevices=db.memberDevices||[{id:'current',name:'Current browser',current:true},{id:'sample',name:'Sample other device',current:false}];syncRewards();syncDocuments();save()}
function syncRewards(){if(!db.memberPerks)return;const month=new Date().toISOString().slice(0,7);for(const o of memberOffers){const id='MEMBER-'+month+'-'+o.id;if(!db.memberPerks.some(r=>r.id===id))db.memberPerks.push({id,offerId:o.id,month,revealed:false,saved:false,createdAt:new Date().toISOString()})}save()}

function offers(){syncRewards();const month=new Date().toISOString().slice(0,7);const perks=db.memberPerks.filter(r=>r.month===month&&(memberFilter!=='saved'||r.saved));return `<div class="page-head"><span class="eyebrow">A LITTLE EXTRA, JUST FOR YOU</span><h1>Offers.</h1><p>Eyewear, music and budget finds. No patient targets.</p></div><div class="offer-hero"><span class="eyebrow">MEMBER PREVIEWS · ${E(month)}</span><h2>Your everyday<br>little extras.</h2><p>Scratch to discover a sample member perk. No referral, admission or payment is needed to unlock it.</p></div><div class="pills"><button class="pill ${memberFilter==='all'?'active':''}" data-action="member-filter" data-value="all">For you</button><button class="pill ${memberFilter==='saved'?'active':''}" data-action="member-filter" data-value="saved">Saved offers</button></div><div class="rewards-grid">${perks.map(r=>{const o=memberOffers.find(o=>o.id===r.offerId);return `<div class="reward-card"><button class="scratch-face ${r.revealed?'reward-face-revealed':''}" data-action="member-open" data-id="${r.id}" style="${r.revealed?'':'background:linear-gradient(135deg,'+o.color+',#859dd2)'}"><div>${r.revealed?`<b>${E(o.reward)}</b><small>${r.saved?'Saved to your offers':'View sample details'}</small>`:`${I(o.id==='audio'?'headphones':o.id==='music'?'music':'gift')}<b>${E(o.brand)}</b><small>Scratch your member preview</small>`}</div></button><div class="reward-details"><b>${E(o.brand)}</b><small>${E(o.title)}</small><button data-action="member-open" data-id="${r.id}">${r.revealed?'View offer':'Reveal preview'} →</button></div></div>`}).join('')}</div>${perks.length?'':empty('No saved offers yet','Reveal a member preview and save it here.')}<div class="info-box">Illustrative offer designs only. No live discount, free subscription, brand partnership or redeemable voucher is promised. ₹799 is an example price, not a verified shopping deal.</div>${footer()}`}
function openMemberPerk(id){const r=memberPerk(id),o=memberOffers.find(o=>o.id===r?.offerId);if(!r||!o)return;sheet(o.brand+' · Member preview',`<div class="partner-mark" style="margin-top:18px;color:${o.color};background:${o.bg}">${E(o.mark)}</div><p>${E(o.desc)}</p><div class="scratch-stage"><div class="scratch-prize">${I(o.id==='audio'?'headphones':o.id==='music'?'music':'gift')}<strong style="font-size:23px">${E(o.reward)}</strong><small>${E(o.code)} · NOT REDEEMABLE</small></div>${r.revealed?'':'<canvas id="member-scratch"></canvas>'}</div>${r.revealed?`<button class="primary" data-action="member-save" data-id="${r.id}">${r.saved?'Saved to offers':'Save this preview'}</button><a class="secondary" style="display:block;text-align:center;margin-top:10px" href="${o.url}" target="_blank" rel="noopener noreferrer">Visit official site ↗</a>`:`<button class="primary" data-action="member-reveal" data-id="${r.id}">Reveal preview · accessible option</button>`}<p class="fineprint">No patient or financial details are shared. This demo code cannot be used on the provider’s website. Revealing/saving does not create cash or a commission balance.</p>`);if(!r.revealed)prepareMemberScratch(r)}
function revealMember(id){const r=memberPerk(id);if(!r)return;if(!r.revealed){r.revealed=true;r.revealedAt=new Date().toISOString();save()}openMemberPerk(id)}
function prepareMemberScratch(r){const canvas=app.querySelector('#member-scratch');if(!canvas)return;const rect=canvas.getBoundingClientRect(),scale=devicePixelRatio||1;canvas.width=Math.round(rect.width*scale);canvas.height=Math.round(rect.height*scale);const ctx=canvas.getContext('2d',{willReadFrequently:true});if(!ctx)return;ctx.scale(scale,scale);ctx.fillStyle='#92a9d8';ctx.fillRect(0,0,rect.width,rect.height);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='600 18px system-ui';ctx.fillText('A little surprise',rect.width/2,rect.height/2-5);ctx.font='11px system-ui';ctx.fillText('Scratch to explore',rect.width/2,rect.height/2+20);let down=false,last;function draw(e){if(!down)return;const b=canvas.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top;ctx.globalCompositeOperation='destination-out';ctx.lineWidth=36;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(last?.x??x,last?.y??y);ctx.lineTo(x,y);ctx.stroke();ctx.beginPath();ctx.arc(x,y,18,0,Math.PI*2);ctx.fill();last={x,y}}canvas.addEventListener('pointerdown',e=>{down=true;last=null;canvas.setPointerCapture(e.pointerId);draw(e)});canvas.addEventListener('pointermove',draw);canvas.addEventListener('pointerup',()=>{down=false;const data=ctx.getImageData(0,0,canvas.width,canvas.height).data;let transparent=0,total=0;for(let i=3;i<data.length;i+=64){transparent+=data[i]===0;total++}if(transparent/total>.35)revealMember(r.id)});canvas.addEventListener('pointercancel',()=>down=false)}
function scratchSheet(id){openMemberPerk(id)}function revealReward(id){revealMember(id)}
function shopping(){return `<div class="page-head"><span class="eyebrow">EVERYDAY DISCOVERY</span><h1>Shopping & services.</h1><p>Explore public marketplaces and service categories.</p></div><div class="shopping-banner"><h2>Find your little extras.</h2><p>Member previews are available without patient referrals or admissions.</p></div><button class="secondary" data-action="offers">View member offers</button><div class="partner-grid" style="margin-top:18px">${partners.map(p=>`<button class="partner-card" data-action="partner" data-id="${p.id}"><span class="partner-mark" style="background:${p.bg};color:${p.color}">${p.mark}</span><h3>${p.name}</h3><p>${p.desc}</p><span class="partner-foot">${p.action}${I('arrow')}</span></button>`).join('')}</div><p class="fineprint">No live offers, affiliation, loans or insurance advice are represented.</p>`}
function security(){const s=db.memberSecurity;return `<div class="page-head"><span class="eyebrow">ACCOUNT & PRIVACY</span><h1>Security centre.</h1><p>Explore security settings and verification flows.</p></div><div class="info-box">Frontend demonstration only. These settings do not implement server authentication, encryption, KYC or protected patient storage.</div><div class="summary-card"><h2>Level 1 · Account access</h2><label class="settings-row"><span><b>Two-step sign-in preview</b><small>Second demo code after initial login.</small></span><input id="member-two-step" type="checkbox" ${s.twoStep?'checked':''}></label><label class="settings-row"><span><b>Login notification</b><small>Record a local sign-in alert.</small></span><input id="member-login-alert" type="checkbox" ${s.loginAlerts?'checked':''}></label><label class="select-compact">Auto-lock after inactivity<select id="member-lock">${[2,5,15].map(n=>`<option value="${n}" ${s.lockMinutes===n?'selected':''}>${n} minutes</option>`).join('')}</select></label><button class="secondary" style="margin-top:14px" data-action="member-lock-now">Lock demo session</button></div><div class="summary-card"><h2>Level 2 · Sessions & privacy</h2>${db.memberDevices.map(d=>`<div class="settings-row"><span><b>${E(d.name)}</b><small>${d.current?'Current UI session':'Simulated device — not a detected real session'}</small></span><button class="small-btn" data-action="member-revoke" data-id="${d.id}">${d.current?'Sign out':'Revoke'}</button></div>`).join('')}<p class="fineprint">Only the signed-in Doctor’s data should be accessible after backend integration. The current sample data is not access-controlled.</p></div><div class="summary-card"><h2>Level 3 · Payment verification</h2>${kv('Beneficiary',s.beneficiary)+kv('Verification',s.beneficiaryStatus.replaceAll('_',' '))}<button class="secondary" style="margin-top:14px" data-action="member-beneficiary">Preview beneficiary verification</button></div><div class="summary-card"><h2>Automatic documents</h2><p class="fineprint">Only recorded event details are copied. No Hospital signature, post-discharge service or government approval is fabricated.</p><button class="secondary" data-action="documents">Open document centre</button></div><div class="heading"><h2>Local activity</h2></div>${db.memberAudit.slice(0,12).map(a=>`<div class="audit-row">${E(a.action)}<small>${stamp(a.at)}</small></div>`).join('')||'<p class="fineprint">No account changes recorded.</p>'}`}

function addRecordedDoc(kind,r,sourceKey,fields){const key=r.id+'|'+kind+'|'+sourceKey;if(db.documents.some(d=>d.key===key))return;db.documents.push({id:uid('DOC'),key,kind,referralId:r.id,sourceKey,generatedAt:new Date().toISOString(),version:1,fields,source:'Recorded browser demo state — not independently verified'})}
function syncDocuments(){if(!db.documents)return;for(const r of db.referrals){const base={referralId:r.id,doctorId:r.doctorId,hospitalId:r.hospitalId,hospitalName:hospital(r.hospitalId).name,patient:r.name};addRecordedDoc('Submission acknowledgement',r,r.created,{...base,submittedAt:r.created,source:r.source});const admission=r.timeline.find(t=>t.title==='Admission confirmed');if(admission)addRecordedDoc('Admission event copy',r,admission.at,{...base,recordedEvent:'Admission confirmed',eventAt:admission.at,eventActor:admission.actor,note:admission.note});if(r.confirmed>0)addRecordedDoc('Recorded amount statement',r,String(r.confirmed),{...base,recordedAmount:r.confirmed,purpose:'Amount recorded in demo; no clinical service certification or legal eligibility is established.'});if(r.claimId&&r.claimed>0)addRecordedDoc('Doctor claim acknowledgement',r,r.claimId,{...base,claimId:r.claimId,requestedAmount:r.claimed,description:'Doctor claim as recorded; not an assertion that a post-discharge service occurred.'});for(const p of r.payments)addRecordedDoc('Recorded payment receipt',r,p.id,{...base,paymentId:p.id,amount:p.amount,recordedAt:p.at,reference:p.reference,source:'Simulated payment entry; not bank-confirmed money.'})}save()}

function downloadRecordedDoc(id){const d=db.documents.find(d=>d.id===id);if(!d)return;const html=`<!doctype html><html><meta charset="utf-8"><title>${E(d.kind)}</title><style>body{font:14px system-ui;color:#26384b;max-width:800px;margin:40px auto;padding:20px}h1{font-size:25px}table{width:100%;border-collapse:collapse}td{padding:11px;border-bottom:1px solid #e8edf3;overflow-wrap:anywhere}td:first-child{width:35%;color:#8596a9}.notice{background:#f4f8fc;border:1px solid #e7edf5;padding:16px;font-size:12px;line-height:1.9}@media print{body{margin:0}}.settings-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #edf1f6}.settings-row b{font-size:11px;font-weight:550;display:block}.settings-row small{font-size:9px;color:#9aa9bb;display:block;margin-top:5px}.settings-row input{accent-color:#426dff}.select-compact{margin-top:15px}.audit-row{padding:12px 0;border-bottom:1px solid #f0f3f7;font-size:10px;color:#8d9eb2}.audit-row small{font-size:8px;display:block;margin-top:6px;color:#adb7c5}</style><h1>${E(d.kind)}</h1><p class="notice">DEMO COPY — NOT A VERIFIED HOSPITAL DOCUMENT OR BANK RECEIPT.<br>Automatically copied from unverified demo records. This is not a post-discharge review certificate or proof of a performed medical service. It must not be used to establish government compliance or payment eligibility.</p><table>${Object.entries({documentId:d.id,generatedAt:d.generatedAt,sourceReference:d.sourceKey,...d.fields}).map(([k,v])=>`<tr><td>${E(k)}</td><td>${E(v)}</td></tr>`).join('')}</table><p class="notice">No signature or Hospital approval has been created by this copy. Its contents only describe the source demo entry as recorded. Print > Save as PDF if required.</p></html>`;const url=URL.createObjectURL(new Blob([html],{type:'text/html'})),a=document.createElement('a');a.href=url;a.download=d.id+'_UNVERIFIED_DEMO.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function beneficiaryPreview(){sheet('Beneficiary verification · Demo',`<p>Use masked dummy data only. No actual bank validation or SMS takes place.</p><div class="summary-card">${kv('Current beneficiary',db.memberSecurity.beneficiary)+kv('State',db.memberSecurity.beneficiaryStatus)}</div><form id="member-bank-form"><label>Masked beneficiary display<input name="beneficiary" maxlength="70" value="${E(db.memberSecurity.beneficiary)}" required></label><button class="primary" type="submit" style="margin-top:14px">Change & mark pending</button></form>${db.memberSecurity.beneficiaryStatus==='pending_verification'?`<form id="member-bank-verify" style="margin-top:18px"><label>Demo verification code<input name="code" maxlength="6" placeholder="Use 654321" required></label><button class="secondary" type="submit" style="margin-top:12px">Complete demo verification</button></form>`:''}`)}

async function hbMakeQR(hid){const target=document.getElementById('qr-preview');if(!target)return;target.textContent='Preparing QR…';try{const d=await HB.api('/intake-link',{hospitalId:hid});if(page!=='qr'||document.getElementById('qr-hospital')?.value!==hid)return;hbQRLink=d.url;target.innerHTML=`<p class="qr-title">${E(d.hospital)}</p><div class="qr-image"><canvas id="hbActualQR" aria-label="Patient intake QR"></canvas></div><p class="fineprint" style="text-align:center">Doctor ${E(db.profile.id)} · ${E(hid)}</p><a class="primary" style="display:block;text-align:center" href="${E(d.url)}" target="_blank" rel="noopener">Open patient form</a><button class="secondary" style="margin-top:8px" onclick="hbDownloadQR()">Download QR</button>`;await HealthQR.toCanvas(document.getElementById('hbActualQR'),d.url,{width:216,margin:4,errorCorrectionLevel:'M',color:{dark:'#173050',light:'#ffffff'}})}catch(e){target.textContent=e.message}}
