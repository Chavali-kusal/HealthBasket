function nav(active){return `<nav class="nav">${(SESSION?.role==='driver'?[['home','Home'],['requests','Requests'],['trips','Trips'],['earnings','Earnings'],['profile','Profile']]:[['home','Home'],['requests','Requests'],['referrals','Doctors'],['payments','Billing'],['profile','Profile']]).map(([k,t])=>`<button onclick="go('${k}')" class="${k===active?'on':''}" ${k===active?'aria-current="page"':''}>${icon(k==='trips'?'driver':k==='payments'?'earnings':k==='referrals'?'hospital':k)}${t}</button>`).join('')}</nav>`}
function page(t,body,foot='',active='home',sub='',back){if(!SESSION)return login();app.innerHTML=`<section class="screen">${head(t,sub,back||"go('home')")}<div class="body">${body}</div>${foot?`<div class="foot">${foot}</div>`:''}</section>${nav(active)}`}
function go(p,id){if(!SESSION&&p!=='login')return login();route=p;selected=id||null;if(p==='login')return login();if(p==='home')return dashboard();if(p==='requests'){filter='new';return requestList()}if(p==='detail')return detail(id);if(p==='trip')return trip(id);if(p==='trips')return trips();if(p==='earnings')return earnings();if(p==='profile')return profile();if(p==='referrals')return referrals();if(p==='referral')return referral(id);if(p==='payments')return payments();if(p==='receipt')return receipt(id)}
function login(){route='login';app.innerHTML=`<section class="screen login"><div class="body"><div class="brand">Health<span>Basket</span><small>PARTNER WORKSPACE</small></div><h1>One care network.<br>Your partner app.</h1><p class="small">Choose your role to continue. Local connected demo only.</p><div class="role"><button class="${roleChoice==='hospital'?'selected':''}" onclick="roleChoice='hospital';login()">${icon('hospital')}<b>Hospital team</b></button><button class="${roleChoice==='driver'?'selected':''}" onclick="roleChoice='driver';login()">${icon('driver')}<b>Ambulance driver</b></button></div><form id="loginForm" onsubmit="event.preventDefault();verifyLogin()">${roleChoice==='hospital'?`<label for="hospital" class="label">Partner hospital</label><select id="hospital" class="input">${HOSP.map(h=>`<option value="${h.id}">${E(h.name)}</option>`).join('')}</select><label class="label" for="staff">Staff name</label><input class="input" id="staff" required maxlength="50" placeholder="Demo team member">`:`<label class="label" for="driverId">Registered driver</label><select id="driverId" class="input"><option value="">Select a driver</option>${partner().drivers.map(d=>`<option value="${d.id}">${E(d.name)} · ${E(d.vehicleNumber)}</option>`).join('')}</select><button type="button" class="btn soft" onclick="driverRegistration()">Register driver / ambulance</button>`}<label class="label" for="loginOTP">Demo access OTP</label><input class="input" id="loginOTP" inputmode="numeric" maxlength="4" required placeholder="1234"><p id="loginError" class="error" role="status"></p><button class="btn" type="submit">Enter partner workspace →</button></form><div class="note">Demo OTP <b>1234</b>. Role selection is not secure authentication. Use sample patient and partner data only.</div><div class="grid2"><a class="safelink" href="customer.html" target="_blank" rel="noopener">Open Customer App ↗</a><a class="safelink" href="doctor.html" target="_blank" rel="noopener">Open Doctor App ↗</a></div></div></section>`}
function verifyLogin(){if(!document.getElementById('loginForm').reportValidity())return;const otp=document.getElementById('loginOTP').value;if(otp!=='1234')return document.getElementById('loginError').textContent='Enter demo OTP 1234.';if(roleChoice==='hospital'){const id=document.getElementById('hospital').value,name=document.getElementById('staff').value.trim();if(!name)return;SESSION={role:'hospital',hospitalId:id,name}}else{const d=partner().drivers.find(d=>d.id===document.getElementById('driverId').value);if(!d)return document.getElementById('loginError').textContent='Choose or register a driver.';SESSION={role:'driver',driverId:d.id,name:d.name}}sessionStorage.setItem('hb_partner_session',JSON.stringify(SESSION));go('home')}
function driverRegistration(){route='register';app.innerHTML=`<section class="screen"><div class="head"><button class="round" onclick="login()">‹</button><div><h1>Register your ambulance</h1><small>Demo onboarding · not real KYC</small></div></div><div class="body"><form id="regForm"><label class="label" for="driverName">Driver name</label><input class="input" id="driverName" maxlength="50" required><div class="grid2"><div><label class="label" for="driverPhone">Mobile</label><input class="input" id="driverPhone" required pattern="[6-9][0-9]{9}" maxlength="10" inputmode="numeric"></div><div><label class="label" for="vehicleNumber">Vehicle number</label><input class="input" id="vehicleNumber" required maxlength="20" placeholder="DEMO AP 001"></div></div><label class="label" for="vehicleClass">Ambulance class</label><select class="input" id="vehicleClass"><option>BLS</option><option>ALS</option><option>ICU</option></select><label class="label" for="registeredAddress">Registered service-base address</label><input class="input" id="registeredAddress" required maxlength="180" placeholder="Station / locality / city"><div class="grid2"><div><label class="label" for="driverLat">Latitude</label><input class="input" id="driverLat" required type="number" step="any" min="-85" max="85"></div><div><label class="label" for="driverLng">Longitude</label><input class="input" id="driverLng" required type="number" step="any" min="-180" max="180"></div></div><button type="button" class="btn soft" onclick="driverGPS()">Use current location for service base</button><button type="button" class="link" onclick="document.getElementById('registeredAddress').value='Sample Anantapur station';document.getElementById('driverLat').value='14.6819';document.getElementById('driverLng').value='77.6006'">Use clearly labelled sample Anantapur base</button><label class="switch small sp"><input type="checkbox" id="driverOptIn" required>I opt in to demo dispatch previews. No real WhatsApp messages are sent.</label><p id="regError" class="error" role="status"></p></form><div class="note">Production requires verified identity, licence, vehicle/clinical capability and permitted insurance/onboarding checks. None is verified in this demo.</div></div><div class="foot"><button class="btn" onclick="registerDriver()">Create demo driver & continue</button></div></section>`}
function driverGPS(){if(!navigator.geolocation)return toast('GPS unavailable. Enter coordinates or use sample base.');navigator.geolocation.getCurrentPosition(p=>{const a=document.getElementById('driverLat'),b=document.getElementById('driverLng');if(a&&b){a.value=p.coords.latitude.toFixed(6);b.value=p.coords.longitude.toFixed(6)}},()=>toast('GPS unavailable. Enter a valid coordinate pair.'),{timeout:8000,enableHighAccuracy:false})}
function registerDriver(){const f=document.getElementById('regForm');if(!f.reportValidity())return;const name=document.getElementById('driverName').value.trim(),phone=document.getElementById('driverPhone').value,vehicleNumber=document.getElementById('vehicleNumber').value.trim(),address=document.getElementById('registeredAddress').value.trim(),lat=Number(document.getElementById('driverLat').value),lng=Number(document.getElementById('driverLng').value);if(!name||!vehicleNumber||!address||!Number.isFinite(lat)||!Number.isFinite(lng))return;const p=partner();if(p.drivers.some(d=>d.phone===phone||d.vehicleNumber.toLowerCase()===vehicleNumber.toLowerCase()))return document.getElementById('regError').textContent='Mobile or vehicle already registered in this demo.';const d={id:uid('DRV'),name,phone,vehicleNumber,vehicle:document.getElementById('vehicleClass').value,registeredAddress:address,lat,lng,optIn:true,online:false,verification:'Demo only · not verified',createdAt:new Date().toISOString()};p.drivers.push(d);localStorage.setItem(PK,JSON.stringify(p));SESSION={role:'driver',driverId:d.id,name:d.name};sessionStorage.setItem('hb_partner_session',JSON.stringify(SESSION));go('home')}
function ownHospital(){return HOSP.find(h=>h.id===SESSION?.hospitalId)}function ownDriver(){return partner().drivers.find(d=>d.id===SESSION?.driverId)}
function hospitalMatch(o){const h=ownHospital();return !!h&&(o.hospitalId===h.id||o.hospital===h.name)}function kmBetween(a,b){const r=x=>x*Math.PI/180,d1=r(b.lat-a.lat),d2=r(b.lng-a.lng),v=Math.sin(d1/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(d2/2)**2;return 6371*2*Math.atan2(Math.sqrt(v),Math.sqrt(Math.max(0,1-v)))}
function eligible(o,d=ownDriver()){return !!d&&d.online&&d.optIn&&o.type==='ambulance'&&o.stage==='dispatching'&&!o.driver&&o.vehicle===d.vehicle&&o.coords&&kmBetween(d,o.coords)<=10&&!(o.declines||[]).includes(d.id)}
function ownRide(o){return SESSION?.role==='driver'&&o.type==='ambulance'&&o.driver?.id===SESSION.driverId}function activeRide(o){return ownRide(o)&&['assigned','arrived','in_trip','dropped'].includes(o.stage)}
function event(s,o,text){o.history=o.history||[];o.updatedAt=new Date().toISOString();o.history.push({at:o.updatedAt,text,actor:SESSION?.role+' · '+SESSION?.name});s.events.unshift({id:o.id,at:o.updatedAt,text});}
async function mutate(fn){const job=()=>{const s=state(),p=partner(),result=fn(s,p);if(result===false)return false;localStorage.setItem(CK,JSON.stringify(s));localStorage.setItem(PK,JSON.stringify(p));return true};try{const ok=navigator.locks?await navigator.locks.request('healthbasket-demo-mutation',job):job();if(ok)refreshCurrent();return ok}catch{toast('Could not save this demo action.');return false}}
function dashboard(){const s=state();if(SESSION.role==='hospital'){const rows=s.orders.filter(hospitalMatch),newCount=rows.filter(o=>o.stage==='requested').length,active=rows.filter(o=>['accepted','priced','ready'].includes(o.stage)).length;page('Partner workspace',`<div class="hero"><small>HOSPITAL TEAM</small><h2>Hello, ${E(SESSION.name)}.</h2><p>${E(ownHospital().name)}<br>One inbox for your connected care requests.</p></div><div class="stats"><div class="stat"><b>${newCount}</b><small>New requests</small></div><div class="stat"><b>${active}</b><small>In progress</small></div><div class="stat"><b>${rows.filter(o=>o.stage==='completed').length}</b><small>Completed</small></div></div><div class="tiles"><button class="tile" onclick="go('requests')"><span class="ico">${icon('requests')}</span><b>Service requests</b><small>Accept, quote & complete</small></button><button class="tile" onclick="go('referrals')"><span class="ico green">${icon('hospital')}</span><b>Doctor submissions</b><small>Track care & admission</small></button><button class="tile" onclick="go('payments')"><span class="ico green">${icon('earnings')}</span><b>Billing & receipts</b><small>Verify direct collections</small></button><button class="tile" onclick="go('profile')"><span class="ico">${icon('shield')}</span><b>Connected apps</b><small>Customer & Doctor tabs</small></button></div><p class="roleline">SAME BROWSER / LOCALHOST DEMO</p>`);return}const d=ownDriver();if(!d)return logout();const rides=s.orders.filter(ownRide),inbox=s.orders.filter(o=>eligible(o,d));page('Driver workspace',`<div class="hero"><small>AMBULANCE PARTNER</small><h2>Ready for your<br>next care trip?</h2><p>Hello, ${E(d.name)} · ${E(d.vehicle)}<br>${E(d.vehicleNumber)}</p></div><div class="onlinebar"><div><b>${d.online?'You are online':'You are offline'}</b><small>Requests within 10 km of registered base</small></div><label class="switch"><input type="checkbox" aria-label="Driver online" ${d.online?'checked':''} onchange="toggleOnline(this.checked)"></label></div><div class="stats"><div class="stat"><b>${inbox.length}</b><small>Nearby requests</small></div><div class="stat"><b>${rides.filter(o=>o.stage==='completed').length}</b><small>Completed trips</small></div><div class="stat"><b>${rides.filter(activeRide).length}</b><small>Active trip</small></div></div>${rides.find(activeRide)?`<button class="btn" onclick="go('trip','${rides.find(activeRide).id}')">Resume active trip →</button>`:''}<div class="tiles"><button class="tile" onclick="go('requests')"><span class="ico red">${icon('driver')}</span><b>Nearby requests</b><small>Review pickup & fare</small></button><button class="tile" onclick="go('earnings')"><span class="ico green">${icon('earnings')}</span><b>Earnings & claims</b><small>Completed, collected trips</small></button></div><p class="roleline">NO REAL DISPATCH / GPS ROUTING / PAYOUT</p>`)}
function toggleOnline(on){const p=partner(),d=p.drivers.find(d=>d.id===SESSION.driverId);if(!d)return;d.online=on;localStorage.setItem(PK,JSON.stringify(p));dashboard()}
function status(o){return ({requested:'New request',priced:'Fee confirmed',accepted:'Accepted',ready:'Awaiting completion OTP',completed:'Completed',cancelled:'Cancelled',dispatching:'New ride request',assigned:'Assigned',arrived:'At pickup',in_trip:'Trip in progress',dropped:'At hospital',interest:'Camp interest'})[o.stage]||o.stage}
function requestCard(o){return `<button class="card request" onclick="go('${SESSION.role==='driver'?'trip':'detail'}','${E(o.id)}')"><span class="ico ${o.type==='ambulance'?'red':''}">${icon(o.type==='ambulance'?'driver':'requests')}</span><span class="grow"><b>${E(o.title||NAMES[o.type]||o.type)}</b><small>${E(o.patient||'Customer')} · ${E(status(o))}<br>${E(o.type==='ambulance'?o.pickup:o.hospital)}</small></span><span class="tag">${o.amount==null?'Bill pending':money(o.amount)}</span></button>`}
function requestList(){const s=state();if(SESSION.role==='driver'){const d=ownDriver(),list=s.orders.filter(o=>eligible(o,d));page('Nearby ride requests',`<div class="note">${d?.online?'Online':'Go online to receive requests'} · ${E(d?.vehicle)} · up to 10 km from ${E(d?.registeredAddress)}. Registration-base proximity is not a live driver location.</div>${list.map(requestCard).join('')||'<div class="empty">No matching requests yet.<br>Register/go online, then request an ambulance in the connected Customer tab.</div>'}`,'','requests');return}const rows=s.orders.filter(hospitalMatch).filter(o=>o.type!=='billpay');const list=rows.filter(o=>filter==='all'||(filter==='new'?['requested','interest','dispatching'].includes(o.stage):filter==='active'?['accepted','priced','ready','assigned','arrived','in_trip','dropped'].includes(o.stage):o.stage==='completed'));page('Service requests',`<div class="tabs">${[['new','New'],['active','Active'],['completed','Completed'],['all','All']].map(([k,t])=>`<button class="${filter===k?'on':''}" onclick="filter='${k}';requestList()">${t}</button>`).join('')}</div>${list.map(requestCard).join('')||'<div class="empty">No requests in this category.<br>Customer requests for this hospital will appear here.</div>'}`,'','requests')}
function allowedOrder(s,id){const o=s.orders.find(o=>o.id===id);return o&&SESSION.role==='hospital'&&hospitalMatch(o)&&o.type!=='ambulance'?o:null}
function detail(id){const o=state().orders.find(o=>o.id===id);if(!o||!hospitalMatch(o)||SESSION.role!=='hospital')return toast('This request belongs to another hospital.');if(o.type==='ambulance'){page('Incoming ambulance',`${routeMap(o)}<div class="card"><h2>${E(status(o))}</h2><p>Patient: ${E(o.patient)}<br>Pickup: ${E(o.pickup)}<br>Driver: ${E(o.driver?.name||'Not assigned')}<br>Trip: ${E(o.id)}<br>Payment: ${E(o.paymentStatus)}</p></div><div class="note">Hospital can track this incoming trip. Only an eligible driver accepts/operates it; no hospital bill or admission is inferred.</div>${history(o)}`,'','requests',o.hospital,"filter='all';requestList()");return}let acts='';if(o.stage==='requested'){if(o.type==='online')acts=`<label class="label" for="doctorName">Confirmed doctor</label><input class="input" id="doctorName" maxlength="60" placeholder="Doctor name"><label class="label" for="fee">Consultation fee · INR</label><input class="input" id="fee" type="number" min="1" max="1000000" step="0.01" value="${o.specialty==='General medicine'?399:599}"><button class="btn sp" onclick="acceptHospital('${id}')">Accept & confirm consultation fee</button>`;else acts=`<button class="btn" onclick="acceptHospital('${id}')">Accept ${o.type==='offers'?'interest':'request'}</button>`}
if(o.stage==='accepted'&&o.type!=='online')acts=`<button class="btn" onclick="markReady('${id}')">Record delivery / service performed</button>`;
if(o.type==='online'&&o.stage==='priced'){acts=o.paymentStatus==='Paid · simulated'?`<button class="btn" onclick="finishOnline('${id}')">Record consultation completed · demo</button>`:'<div class="note">Awaiting customer company checkout. Do not mark a real payment from this panel.</div>'}
if(['ready','completed'].includes(o.stage)&&o.type!=='online'&&!['Paid · simulated','Cash received · simulated'].includes(o.paymentStatus)){acts+=`<div class="title"><h2>Provider bill</h2><small>After service</small></div><p class="hbBillNumber"><span>Bill no.</span><b>${E(o.billRef||o.id)}</b></p><div class="grid2"><div><label class="label" for="billAmount">Amount INR</label><input class="input" id="billAmount" type="number" min="1" max="1000000" step="0.01" value="${o.amount||''}" ${o.paymentStatus==='Paid · simulated'||o.paymentStatus==='Cash received · simulated'?'disabled':''}></div></div><button class="btn soft" onclick="issueBill('${id}')">Issue / confirm actual bill</button>`;if(o.amount&&!['Paid · simulated','Cash received · simulated'].includes(o.paymentStatus))acts+=`<div class="grid2"><button class="btn soft" onclick="issueLink('${id}')">Generate payment link</button><button class="btn soft" onclick="receiveCash('${id}')">Record cash received</button></div>`;if(o.stage==='ready')acts+=`<label class="label" for="completionOTP">Customer completion OTP</label><input class="input otpInput" id="completionOTP" inputmode="numeric" maxlength="4" placeholder="From customer"><button class="btn sp" onclick="verifyServiceOTP('${id}')">Verify & complete request</button>`}
if(['ready','completed'].includes(o.stage)&&o.type!=='online'&&['Paid · simulated','Cash received · simulated'].includes(o.paymentStatus))acts=`<div class="card hbPaidBill"><h2>Bill summary</h2><p class="hbBillNumber"><span>Bill no.</span><b>${E(o.billRef||o.id)}</b></p><div class="row"><span>Paid · demo</span><b>${money(o.amount)}</b></div></div>`;
if(o.stage==='ready'&&o.type!=='online'&&['Paid · simulated','Cash received · simulated'].includes(o.paymentStatus))acts+=`<label class="label" for="completionOTP">Customer completion OTP</label><input class="input otpInput" id="completionOTP" inputmode="numeric" maxlength="4" placeholder="From customer"><button class="btn sp" onclick="verifyServiceOTP('${id}')">Verify & complete request</button>`;
if(o.stage==='interest')acts='<div class="note">Camp interest recorded. Schedule/availability require hospital follow-up; no charge.</div>'+(o.hospitalAcknowledged?'<span class="tag green">Interest acknowledged</span>':`<button class="btn" onclick="acknowledgeCamp('${id}')">Acknowledge camp interest</button>`);
page(o.title||NAMES[o.type]||'Request',`<div class="card"><div class="row"><span class="tag">${E(status(o))}</span><small class="ref">${E(o.id)}</small></div><p>Patient: ${E(o.patient||'')}<br>${E(o.hospital)}<br>${E(o.date||'')} ${E(o.slot||'')}<br>${E(o.address||o.reason||o.description||'')}</p><p>Payment: ${E(o.paymentStatus)}${o.amount!=null?' · '+money(o.amount):''}</p></div>${o.rx?`<div class="proof">Prescription: ${E(o.rx.name)}<br>Type: ${E(o.rx.type)} · ${(o.rx.size/1024).toFixed(0)} KB<button class="btn soft" onclick="viewRx('${id}')">View customer prescription</button><div id="rxPreview"></div></div>`:''}<div class="sp">${acts}</div>${['requested','accepted','priced'].includes(o.stage)?`<button class="link" onclick="rejectRequest('${id}')">Decline / cancel with reason</button>`:''}<div class="note">All actions are shared local demo events. Service completion is separate from payment verification.</div>${history(o)}`,'','requests',o.hospital,"filter='all';requestList()")}
function history(o){return `<details class="hbHistory"><summary>Request & payment history · ${(o.history||[]).length} updates <span>View timeline ›</span></summary><div class="hbHistoryContent">${(o.history||[]).slice().reverse().map(e=>`<div class="timeline"><i>✓</i><div>${E(e.text||e.title)}<small>${new Date(e.at).toLocaleString('en-IN',{timeZone:'Asia/Kolkata'})}</small></div></div>`).join('')||'<p>No activity yet.</p>'}</div></details>`}

async function acceptHospital(id){const name=document.getElementById('doctorName')?.value.trim(),fee=Number(document.getElementById('fee')?.value);await mutate(s=>{const o=allowedOrder(s,id);if(!o||o.stage!=='requested')return toast('Request is no longer available.'),false;if(o.type==='online'){if(!name||!Number.isFinite(fee)||fee<=0||fee>1000000)return toast('Enter confirmed doctor and valid fee.'),false;o.doctor=name;o.doctorId=SESSION.hospitalId+'-'+name.toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,30);o.amount=Math.round(fee*100)/100;o.stage='priced';o.paymentStatus='Company payment due'}else o.stage='accepted';o.hospitalAcceptedBy=SESSION.name;event(s,o,'Hospital team accepted request'+(o.type==='online'?' and confirmed doctor/fee':''));})}
async function markReady(id){await mutate(s=>{const o=allowedOrder(s,id);if(!o||o.stage!=='accepted')return false;o.stage='ready';o.serviceDoneAt=new Date().toISOString();o.completionOTP=String(Math.floor(1000+Math.random()*9000));event(s,o,'Hospital recorded service/delivery; awaiting customer completion OTP')})}
async function finishOnline(id){await mutate(s=>{const o=allowedOrder(s,id);if(!o||o.type!=='online'||o.stage!=='priced'||o.paymentStatus!=='Paid · simulated')return false;o.stage='completed';o.completedAt=new Date().toISOString();s.visits.unshift({doctorId:o.doctorId,name:o.doctor,hospital:o.hospital,specialty:o.specialty,completed:true,at:o.completedAt});event(s,o,'Hospital recorded consultation completion in connected demo')})}
async function issueBill(id){const n=Number(document.getElementById('billAmount').value),ref=document.getElementById('billRef').value.trim();if(!Number.isFinite(n)||n<=0||n>1000000||!ref)return toast('Enter amount and bill reference.');await mutate(s=>{const o=allowedOrder(s,id);if(!o||!['ready','completed'].includes(o.stage)||['Paid · simulated','Cash received · simulated'].includes(o.paymentStatus))return toast('Bill cannot change after collection.'),false;if(o.paymentLink?.status==='paid')return false;o.amount=Math.round(n*100)/100;o.billRef=ref;o.paymentLink=null;o.paymentStatus='Bill issued · due after service';event(s,o,'Hospital issued actual demo bill '+money(o.amount)+' / '+ref)})}
async function issueLink(id){await mutate(s=>{const o=allowedOrder(s,id);if(!o||!['ready','completed'].includes(o.stage)||!o.amount||['Paid · simulated','Cash received · simulated'].includes(o.paymentStatus))return false;if(o.paymentLink&&o.paymentLink.expiresAt>Date.now())return toast('Existing link is still active.'),false;o.paymentLink={id:uid('LINK-DEMO'),amount:o.amount,createdAt:new Date().toISOString(),expiresAt:Date.now()+1800000,status:'issued'};event(s,o,'Hospital issued after-service demo payment link; open it in Customer App')})}
async function receiveCash(id){await mutate(s=>{const o=allowedOrder(s,id);if(!o||!['ready','completed'].includes(o.stage)||!o.amount||['Paid · simulated','Cash received · simulated'].includes(o.paymentStatus))return false;o.paymentStatus='Cash received · simulated';o.paymentMethod='Cash';o.paymentRef=uid('CASH-DEMO');event(s,o,'Hospital acknowledged cash receipt in demo; not bank verification')})}
async function verifyServiceOTP(id){const code=document.getElementById('completionOTP').value;await mutate(s=>{const o=allowedOrder(s,id);if(!o||o.stage!=='ready')return false;if(o.completionOTP!==code)return toast('Completion OTP does not match.'),false;o.completionVerified=true;o.stage='completed';o.completedAt=new Date().toISOString();event(s,o,'Hospital verified customer completion OTP in demo')})}
function rejectRequest(id){const reason=prompt('Reason for declining/cancelling this demo request:');if(!reason?.trim())return;mutate(s=>{const o=allowedOrder(s,id);if(!o||!['requested','accepted','priced'].includes(o.stage))return false;o.stage='cancelled';o.cancelReason=reason.trim();if(o.paymentStatus==='Paid · simulated'){o.refundStatus='Refund requested · simulated';o.paymentStatus='Refund pending · simulated'}event(s,o,'Hospital declined/cancelled request: '+reason.trim())})}
const fileChannel=typeof BroadcastChannel!=='undefined'?new BroadcastChannel('healthbasket_demo_prescriptions'):null;let rxPending=null;
function viewRx(id){const o=state().orders.find(o=>o.id===id);if(!o||!hospitalMatch(o)||!o.rx)return;if(!fileChannel)return toast('Use same-origin localhost with a supported browser.');rxPending=id;document.getElementById('rxPreview').innerHTML='<p class="small">Requesting file from the open Customer tab…</p>';fileChannel.postMessage({kind:'get_prescription',orderId:id,hospitalId:SESSION.hospitalId});setTimeout(()=>{if(rxPending===id&&document.getElementById('rxPreview'))document.getElementById('rxPreview').innerHTML='<p class="small">Customer tab must remain open from the upload session. File bytes are not persisted.</p>'},2500)}

function routeMap(o){return `<div class="map"><svg viewBox="0 0 360 200" preserveAspectRatio="none"><path d="M0 40 360 155M0 110 260 0M70 210 360 30M150 0 250 200M0 170 360 100" stroke="white" stroke-width="13"/><path d="m60 150 48-44 44 20 75-70 55 18" stroke="#7ba5ec" stroke-width="4"/><circle cx="60" cy="150" r="7" fill="#426dff" stroke="white"/><circle cx="282" cy="74" r="7" fill="#e58e96" stroke="white"/></svg><span class="maptag">ILLUSTRATIVE ROUTE · NOT LIVE NAVIGATION</span><span class="car">${icon('driver')}</span></div>`}
function trip(id){const o=state().orders.find(o=>o.id===id);if(!o||SESSION.role!=='driver'||!ownRide(o)&&!eligible(o)){route='requests';selected=null;requestList();return toast('Ride is no longer assigned or eligible for this driver.');}const mine=ownRide(o);let actions='';if(!mine&&o.stage==='dispatching')actions=`<button class="btn" onclick="acceptRide('${id}')">Accept ${money(o.amount)} trip →</button><button class="btn soft" onclick="declineRide('${id}')">Pass this request</button>`;

page(mine?status(o):'New ambulance request',`${routeMap(o)}<div class="card"><div class="row"><div><h2>${E(o.vehicle)} · ${money(o.amount)}</h2><small>${E(o.id)}</small></div><span class="tag ${mine?'green':''}">${mine?'Assigned to you':'Nearby request'}</span></div><p>Pickup: ${E(o.pickup)}<br>Destination: ${E(o.hospital)}</p><p>Patient: ${E(o.patient||'Customer')}<br>Payment: ${E(o.paymentStatus)}</p><table class="table"><tr><td>Base fare</td><td>₹1,200</td></tr><tr><td>${o.fare?.km??o.km} km × ₹12</td><td>${money((o.fare?.km??o.km)*12)}</td></tr><tr><td>Extra services</td><td>₹100</td></tr></table></div>${o.coords?`<a class="safelink" href="https://www.google.com/maps?q=${o.coords.lat},${o.coords.lng}" target="_blank" rel="noopener">Open confirmed pickup in Maps ↗</a>`:''}${actions}${mine&&['assigned','arrived','in_trip'].includes(o.stage)?`<button class="btn soft" onclick="shareDriverGPS('${id}')">Share current GPS point · demo</button>`:''}${o.driverLocation?`<p class="small">Last shared point: ${o.driverLocation.lat.toFixed(5)}, ${o.driverLocation.lng.toFixed(5)} · ${new Date(o.driverLocation.at).toLocaleTimeString()}</p>`:''}<div class="note">Preview navigation and stage updates only; no actual emergency dispatch or secure live route monitoring.</div>${history(o)}`,'','trips','Trip workflow',"go('trips')")}
async function acceptRide(id){await mutate((s,p)=>{const o=s.orders.find(o=>o.id===id),d=p.drivers.find(d=>d.id===SESSION.driverId);if(!o||!eligible(o,d))return toast('This request is no longer available.'),false;if(s.orders.some(activeRide))return toast('Finish your active trip before accepting another.'),false;o.driver={...d};o.stage='assigned';o.assignedAt=new Date().toISOString();event(s,o,'Registered driver '+d.name+' accepted the trip');selected=id;route='trip'})}

function shareDriverGPS(id){if(!navigator.geolocation)return toast('GPS unavailable. No position was shared.');navigator.geolocation.getCurrentPosition(p=>mutate(s=>{const o=s.orders.find(o=>o.id===id);if(!o||!ownRide(o)||!['assigned','arrived','in_trip'].includes(o.stage))return false;o.driverLocation={lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy,at:new Date().toISOString(),source:'browser GPS · demo'};event(s,o,'Driver shared a browser GPS point; not continuous live tracking')}),()=>toast('Location unavailable or permission denied.'),{enableHighAccuracy:true,timeout:8000,maximumAge:5000})}

function referrals(){if(SESSION.role!=='hospital')return;const d=read(DK,{referrals:[]});const rows=(d.referrals||[]).filter(r=>r.hospitalId===SESSION.hospitalId);page('Doctor submissions',`<div class="note">Care coordination only: view submission, begin follow-up and confirm admission. This partner build does not approve referral-linked payments or invent professional services.</div>${rows.map(r=>`<button class="card request" onclick="go('referral','${E(r.id)}')"><span class="ico green">${icon('hospital')}</span><span class="grow"><b>${E(r.name)}</b><small>${E(r.problem)} · ${E(r.status)}<br>${E(r.id)} · ${E(r.doctorId)}</small></span><span>›</span></button>`).join('')||'<div class="empty">No Doctor App submissions for this hospital.<br>Use a Doctor hospital identity (KIMS / Sunrise / Greenleaf) to view its mapped referrals.</div>'}`,'','referrals')}

async function advanceReferral(id,next){if(SESSION.role!=='hospital')return;const job=()=>{const d=read(DK,null),r=d?.referrals?.find(r=>r.id===id&&r.hospitalId===SESSION.hospitalId);if(!r||({submitted:'follow_up',follow_up:'admitted'})[r.status]!==next)return toast('Submission state has changed.');r.status=next;r.timeline=r.timeline||[];const at=new Date().toISOString(),title=next==='follow_up'?'Hospital follow-up started':'Admission confirmed';r.timeline.push({title,actor:'Hospital partner · '+SESSION.name,at,note:'Explicit care event recorded in local demo. No clinical service or fee inferred.'});d.notifications=d.notifications||[];d.notifications.unshift({id:uid('NOTICE'),title,body:r.name+' · '+ownHospital().name,at,read:false,referralId:r.id,type:'hospital'});localStorage.setItem(DK,JSON.stringify(d));referral(id)};navigator.locks?await navigator.locks.request('healthbasket-doctor-demo',job):job()}

confirmReceipt=id=>{if(!document.getElementById('receiptChecked').checked)return toast('Confirm the independent receipt check first.');hbPartnerAction('receipt_confirm',id)};
acknowledgeCamp=id=>hbPartnerAction('accept',id);
viewRx=async function(id){const o=state().orders.find(o=>o.id===id);if(!o||!hospitalMatch(o)||!o.rx)return;const n=document.getElementById('rxPreview');if(!o.rx.documentId){n.innerHTML='<p class="small">The customer upload has not finished. Refresh this request shortly.</p>';return}n.innerHTML='<p class="small">Loading protected prescription from shared database…</p>';try{const r=await fetch('/api/documents/'+encodeURIComponent(o.rx.documentId),{headers:{Authorization:'Bearer '+HB.token}});if(!r.ok)throw Error('Access denied or file unavailable.');const f=await r.blob();if(photoURL)URL.revokeObjectURL(photoURL);photoURL=URL.createObjectURL(f);n.innerHTML=f.type==='application/pdf'?`<iframe title="Prescription PDF" src="${photoURL}" style="width:100%;height:240px;border:0"></iframe>`:`<img src="${photoURL}" alt="Customer prescription" style="max-width:100%;max-height:260px;object-fit:contain">`}catch(e){n.textContent=e.message}};
nav=function(active){const items=HB.role==='hospital'?[['home','Overview'],['requests','Inbox'],['reports','Reports'],['payments','Billing'],['profile','Account']]:[['home','Home'],['requests','Requests'],['trips','Trips'],['reports','Reports'],['profile','Account']];return `<nav class="nav">${items.map(([k,t])=>`<button onclick="go('${k}')" class="${k===active?'on':''}" ${k===active?'aria-current="page"':''}>${icon(k==='trips'?'driver':k==='payments'?'earnings':k)}${t}</button>`).join('')}</nav>`};
const hbPartnerGo=go;go=function(p,id){if(p==='reports'){route='reports';selected=null;page('Activity reports','<div id="hbReportRoot"></div>','','reports','Date & service filters · PDF / Excel');HBReports.mount(document.getElementById('hbReportRoot'));return}hbPartnerGo(p,id)};
dashboard=function(){if(!SESSION)return login();const s=state();if(HB.role==='hospital'){const rows=s.orders.filter(hospitalMatch),incoming=rows.filter(o=>o.type==='ambulance'&&!['completed','cancelled'].includes(o.stage)),pending=rows.filter(o=>o.stage==='requested');page('Hospital overview',`<div class="proHospitalIntro"><span class="proEyebrow">CARE OPERATIONS</span><div class="row"><h2>Good day, <br>${E(SESSION.name)}.</h2><span class="proClinicIcon">${icon('hospital')}</span></div><p>${E(ownHospital().name)}</p><span class="proConnection"><i></i> Shared database connected</span></div><div class="stats proStats"><div class="stat"><b>${pending.length}</b><small>Awaiting action</small></div><div class="stat"><b>${rows.filter(o=>['accepted','priced','ready'].includes(o.stage)).length}</b><small>In progress</small></div><div class="stat"><b>${rows.filter(o=>o.stage==='completed').length}</b><small>Completed</small></div></div>${incoming.length?`<button class="proAlert" onclick="go('detail','${incoming[0].id}')"><span class="ico red">${icon('driver')}</span><div class="grow"><b>${incoming.length} incoming ambulance trip${incoming.length>1?'s':''}</b><small>Pickup and handover updates are shared here</small></div><span>›</span></button>`:''}<div class="title"><h2>Your workspace</h2><small>Hospital-scoped access</small></div><div class="tiles proHospitalTiles">${[['requests','requests','Service inbox','Accept & manage requests'],['referrals','hospital','Doctor submissions','Coordinate patient care'],['reports','reports','Activity reports','Dates, PDF & Excel'],['payments','earnings','Billing & receipts','Collections & verification']].map(([p,i,t,sub])=>`<button class="tile" onclick="go('${p}')"><span class="ico">${icon(i)}</span><b>${t}</b><small>${sub}</small></button>`).join('')}</div><div class="title"><h2>Needs your attention</h2><small>Latest requests</small></div>${pending.slice(0,2).map(requestCard).join('')||'<div class="proQuiet">You’re up to date.<span>New patient requests will appear here automatically.</span></div>'}`,'','home','HealthBasket · Hospital App');return}
const d=ownDriver();if(!d)return logout();const rides=s.orders.filter(ownRide),active=rides.find(activeRide),ready=rides.filter(claimEligible),near=s.orders.filter(o=>eligible(o,d));page('AmbuSprint',`<div class="proDriverHero"><div class="row"><span class="proEyebrow">YOUR DRIVER WORKSPACE</span><span class="proDriverBadge">${E(d.vehicle)}</span></div><h2>Every trip.<br>A difference.</h2><p>${E(d.name)} · ${E(d.vehicleNumber)}</p><div class="proDriverSwitch"><div><b>${d.online?'You’re online':'Ready when you are'}</b><small>${d.online?'Matching nearby care requests':'Go online to receive ride requests'}</small></div><label class="switch"><input type="checkbox" aria-label="Driver online" ${d.online?'checked':''} onchange="toggleOnline(this.checked)"></label></div></div>${active?`<button class="proAlert" onclick="go('trip','${active.id}')"><span class="ico green">${icon('driver')}</span><span class="grow"><b>${E(status(active))}</b><small>Resume your active care trip</small></span><b>›</b></button>`:''}<div class="proEarningsStrip"><div><small>Eligible earnings</small><b>${money(ready.reduce((n,o)=>n+o.amount,0))}</b></div><button onclick="go('earnings')">View earnings ↗</button></div><div class="stats proStats"><div class="stat"><b>${near.length}</b><small>Nearby requests</small></div><div class="stat"><b>${rides.filter(o=>o.stage==='completed').length}</b><small>Completed trips</small></div><div class="stat"><b>${active?1:0}</b><small>Active trip</small></div></div><div class="tiles proDriverTiles"><button class="tile" onclick="go('requests')"><span class="ico green">${icon('driver')}</span><b>Find your next trip</b><small>Review pickup & fare</small></button><button class="tile" onclick="go('reports')"><span class="ico green">${icon('reports')}</span><b>Trip reports</b><small>Dates, PDF & Excel</small></button></div><div class="title"><h2>Nearby care requests</h2><small>${E(d.vehicle)} · up to 10 km</small></div>${near.slice(0,2).map(requestCard).join('')||'<div class="proQuiet">No matching requests yet.<span>Your registered base and vehicle class decide matches.</span></div>'}`,'','home','Ambulance Partner App')};
profile=function(){const d=ownDriver();page('My account',`<div class="proProfileCard"><span class="proAvatar">${E(SESSION.name.slice(0,2).toUpperCase())}</span><h2>${E(SESSION.name)}</h2><p>${HB.role==='hospital'?E(ownHospital().name):E(d?.vehicleNumber)+' · '+E(d?.vehicle)}</p><span class="tag">${HB.role==='hospital'?'Hospital staff':'Ambulance partner'} · demo</span></div><button class="card request" onclick="go('reports')"><span class="ico">${icon('reports')}</span><span class="grow"><b>Reports & downloads</b><small>Date / service filters · PDF & Excel</small></span><span>›</span></button>${d?`<div class="card"><h2>Registered service base</h2><p>${E(d.registeredAddress)}<br>${d.lat.toFixed(5)}, ${d.lng.toFixed(5)}</p><small>Registration is a demo; no real KYC is verified.</small></div><button class="btn soft" onclick="go('earnings')">Earnings & driver claims</button>`:''}<div class="note">This account uses a shared SQLite database through role-scoped APIs. Medical services, gateway payments and dispatch remain demonstrations.</div><button class="btn soft" onclick="logout()">Sign out</button>`,'','profile')};
let hbPendingPaint=false;
function hbPartnerPoll(s){hbPartnerApply(s);if(route==='reports')return;if(document.activeElement?.matches('input,textarea,select')){hbPendingPaint=true;return}hbPendingPaint=false;refreshCurrent()}
document.addEventListener('focusout',()=>setTimeout(()=>{if(hbPendingPaint&&SESSION&&route!=='reports'&&!document.activeElement?.matches('input,textarea,select')){hbPendingPaint=false;refreshCurrent()}},0));
(async()=>{try{if(HB.token){const s=await HB.refresh();HB.ready=true;hbPartnerApply(s);go('home');HB.startPoll(hbPartnerPoll)}else login()}catch{HB.token='';sessionStorage.removeItem('hb_api_'+HB.role);login()}HB.unmask()})();
function hbTodayIST(){const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const v=k=>parts.find(p=>p.type===k).value;return v('year')+'-'+v('month')+'-'+v('day')}
const hbScopedPage=page;page=function(t,b,f='',active='home',sub='',back){hbScopedPage(t,b,f,active,sub||(HB.role==='hospital'&&SESSION?ownHospital()?.name:''),back);if(!SESSION||HB.role!=='hospital')return;if(active==='reports'){const sub=document.querySelector('.head small');if(sub)sub.textContent=ownHospital().name+' · '+SESSION.hospitalId;const refresh=document.createElement('button');refresh.className='round';refresh.setAttribute('aria-label','Refresh hospital data');refresh.textContent='↻';refresh.onclick=hbRefreshHospital;document.querySelector('.head')?.append(refresh);return}if(!['requests','referrals','payments'].includes(active))return;const body=document.querySelector('.body');if(!body)return;const banner=document.createElement('div');banner.className='hbHospitalScope';banner.innerHTML=`<div><b>${E(ownHospital().name)}</b><small>${E(SESSION.hospitalId)} · this hospital’s requests only</small></div><button aria-label="Refresh hospital data" onclick="hbRefreshHospital()">↻</button>`;body.prepend(banner)};
async function hbRefreshHospital(){try{hbPartnerApply(await HB.refresh());if(route==='reports'){HBReports.mount(document.getElementById('hbReportRoot'));return}refreshCurrent();toast('Hospital data refreshed.')}catch(e){toast(e.message)}}
function hbScheduleFields(o){const times=String(o.slot||'').match(/\b(?:[01]\d|2[0-3]):[0-5]\d\b/g)||['09:00','11:00'];const initial=o.stage==='requested';return `<section class="hbScheduleFields"><div class="title"><h2>${initial?'Doctor availability':'Revise appointment'}</h2></div><p class="small">Customer preference: ${E(o.requestedDate||o.date||'Not specified')} · ${E(o.requestedSlot||o.slot||'Not specified')}</p>${initial?`<label class="label"><input type="radio" name="scheduleMode" value="keep" checked onchange="hbToggleSchedule(false)"> Doctor available — accept requested slot</label><label class="label"><input type="radio" name="scheduleMode" value="change" onchange="hbToggleSchedule(true)"> Doctor unavailable — propose another slot</label>`:''}<div id="hbSlotEditor" ${initial?'hidden':''}><label class="label" for="confirmedDate">Confirmed date</label><input id="confirmedDate" class="input" type="date" min="${hbTodayIST()}" value="${E(o.confirmedDate||o.date||hbTodayIST())}" required><div class="grid2"><div><label class="label" for="confirmedStart">Start time · IST</label><input class="input" type="time" id="confirmedStart" value="${E(o.confirmedStart||times[0])}" required></div><div><label class="label" for="confirmedEnd">End time · IST</label><input class="input" type="time" id="confirmedEnd" value="${E(o.confirmedEnd||times[1])}" required></div></div><p class="small">A changed slot requires customer approval.</p></div><p class="small">Accepting the requested slot needs no date/time change. Hospital staff verify availability.</p></section>`}
function hbToggleSchedule(change){document.getElementById('hbSlotEditor').hidden=!change}

const hbScheduledDetail=detail;detail=function(id){hbScheduledDetail(id);const o=state().orders.find(o=>o.id===id);if(HB.role!=='hospital'||!o||!hospitalMatch(o)||o.type!=='online')return;const body=document.querySelector('.body');if(o.stage==='requested'){const button=[...body.querySelectorAll('button')].find(b=>b.textContent.trim()==='Accept & confirm consultation fee');if(button){button.insertAdjacentHTML('beforebegin',hbScheduleFields(o));button.textContent='Accept & confirm doctor, fee & slot'}}else if(o.stage==='priced'){const box=document.createElement('div');box.className='card hbConfirmedSchedule';box.innerHTML=`<h2>${o.scheduleNeedsAcceptance&&!o.scheduleAccepted?'Awaiting customer schedule approval':'Confirmed appointment'}</h2><p>${E(o.doctor)}<br>${E(o.confirmedDate||o.date)} · ${E(o.slot)} IST</p><div class="note">${o.paymentStatus==='Paid · simulated'?'Payment received · demo · '+money(o.amount)+'. After the consultation, record completion below.':'Awaiting customer payment. The appointment is already confirmed.'}</div><button class="btn soft" onclick="hbOpenReschedule('${o.id}')">Change appointment (optional)</button><div id="hbReschedulePanel" hidden>${hbScheduleFields(o)}<button class="btn soft" onclick="hbReschedule('${o.id}')">Propose revised date / time</button><button class="link" onclick="document.getElementById('hbReschedulePanel').hidden=true">Keep confirmed appointment</button></div>`;body.querySelector('.card')?.after(box);if(o.scheduleNeedsAcceptance&&!o.scheduleAccepted)body.querySelectorAll('.note').forEach(n=>{if(n.textContent.includes('Awaiting customer company checkout'))n.textContent='Awaiting customer approval of the revised date/time. Payment follows approval.'});if(o.scheduleNeedsAcceptance&&!o.scheduleAccepted)[...body.querySelectorAll('button')].filter(b=>b.textContent.includes('Record consultation completed')).forEach(b=>b.disabled=true)}};
function hbSchedulePayload(){if(document.querySelector('input[name="scheduleMode"]:checked')?.value==='keep')return {scheduleMode:'keep'};const d=document.getElementById('confirmedDate'),s=document.getElementById('confirmedStart'),e=document.getElementById('confirmedEnd');if(!d?.value||!s?.value||!e?.value||e.value<=s.value){toast('Choose a date and a valid start/end time.');return null}return {scheduleMode:'change',date:d.value,start:s.value,end:e.value}}
acceptHospital=id=>{const o=state().orders.find(o=>o.id===id);const schedule=o?.type==='online'?hbSchedulePayload():{};if(schedule===null)return;return hbPartnerAction('accept',id,{doctor:document.getElementById('doctorName')?.value.trim(),amount:Number(document.getElementById('fee')?.value),...schedule})};
function hbReschedule(id){const schedule=hbSchedulePayload();if(schedule)hbPartnerAction('reschedule',id,schedule)}

function hbOpenReschedule(id){document.getElementById('hbReschedulePanel').hidden=false}


const hbRefundDetail=detail;detail=function(id){hbRefundDetail(id);const o=state().orders.find(x=>x.id===id);if(HB.role!=='hospital'||!o)return;const body=document.querySelector('.body');if(o.cancellationStatus){const box=document.createElement('div');box.className='card';box.innerHTML=`<h2>Cancellation ${E(o.cancellationStatus)}</h2><p>${E(o.cancellationReason||o.cancelReason||'')}<br>${E(o.cancellationRequestId||'')}</p>${o.cancellationStatus==='Pending approval'?`<label class="label">Hospital verification / reason</label><textarea class="input" id="hbCancelDecision" maxlength="400" placeholder="Confirm service not completed; record your verification"></textarea><button class="btn" onclick="hbCancelDecision('${id}',true)">Approve cancellation</button><button class="btn soft" onclick="hbCancelDecision('${id}',false)">Reject cancellation</button>`:`<small>${E(o.cancellationDecisionNote||'')}</small>`}`;body.querySelector('.card')?.after(box);if(o.cancellationStatus==='Pending approval')body.querySelectorAll('button').forEach(b=>{if(!box.contains(b)&&!b.getAttribute('aria-label')?.includes('Refresh'))b.disabled=true})}if(o.refundStatus){const box=document.createElement('div');box.className='card';box.innerHTML=`<h2>Refund status</h2><p>${E(o.refundStatus)} · ${money(o.refundAmount??o.amount)}<br>${E(o.refundMethod||'Customer claim not submitted')}<br>${E(o.refundId||'')}</p><small>Company finance handles reconciliation; hospital cannot issue credits or transfer money.</small>`;body.querySelector('.card')?.after(box)}if(o.stage==='completed'){const box=document.createElement('details');box.className='hbHistory';box.innerHTML=`<summary>Publish actual clinical document</summary><div class="hbHistoryContent"><label class="label">Document type</label><select id="hbReportKind" class="input"><option value="report">Report</option><option value="prescription">Prescription</option><option value="discharge">Discharge summary</option></select><label class="label">Actual PDF / photo</label><input id="hbClinicalFile" type="file" accept="application/pdf,image/png,image/jpeg,image/webp" class="input"><button class="btn" onclick="hbPublishReport('${id}')">Publish to customer Records</button><p class="small">Upload sample documents only. No clinical report is fabricated automatically.</p></div>`;body.append(box)}};
function hbCancelDecision(id,approve){const note=document.getElementById('hbCancelDecision').value.trim();if(!note)return toast('Record verification / decision reason.');hbPartnerAction(approve?'cancel_approve':'cancel_reject',id,{note})}
async function hbPublishReport(id){const f=document.getElementById('hbClinicalFile').files[0],kind=document.getElementById('hbReportKind').value;if(!f)return toast('Choose a sample PDF or photo.');if(f.size>10*1024*1024)return toast('Maximum 10 MB.');HB.writing=true;try{const base64=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result.split(',')[1]);r.onerror=reject;r.readAsDataURL(f)});hbPartnerApply(await HB.api('/documents',{requestId:id,kind,filename:f.name,mime:f.type,base64}));refreshCurrent();toast('Document published to customer Records.')}catch(e){toast(e.message)}finally{HB.writing=false}}
const hbPrivateProfile=profile;profile=function(){hbPrivateProfile();const b=document.createElement('button');b.className='btn soft';b.textContent='Privacy, export & account deletion request';b.onclick=HB.privacy;document.querySelector('.body')?.append(b)};
let hbSeenRides=new Set();const hbPresenceApply=hbPartnerApply;hbPartnerApply=function(s,paint=false){hbPresenceApply(s,paint);if(HB.role!=='driver')return;const d=ownDriver();if(!d?.online)return;const ids=s.customer.orders.filter(o=>eligible(o,d));const fresh=ids.filter(o=>!hbSeenRides.has(o.id));ids.forEach(o=>hbSeenRides.add(o.id));if(fresh.length){toast(fresh.length+' nearby ambulance request'+(fresh.length>1?'s':'')+' available');if('Notification' in window&&Notification.permission==='granted')new Notification('AmbuSprint · nearby request',{body:'Open your driver inbox to review pickup and fare.',tag:'ambusprint-nearby'})}};
const hbDriverAlertProfile=profile;profile=function(){hbDriverAlertProfile();if(HB.role!=='driver')return;const div=document.createElement('div');div.className='card';div.innerHTML='<h2>Request alerts</h2><p class="small">Login turns availability on. Manual off or signout stops new request matching. Screen lock does not switch your saved availability off.</p><button class="btn soft" onclick="hbEnableDriverAlerts()">Enable browser alerts</button><p class="small">This demo alerts while the tab is running. Locked-screen/background push is not configured; it needs an HTTPS push service or native push integration.</p>';document.querySelector('.body')?.append(div)};
async function hbEnableDriverAlerts(){if(!('Notification' in window))return toast('Browser alerts unsupported.');const permission=await Notification.requestPermission();toast(permission==='granted'?'Browser alerts enabled for this running tab.':'Browser alerts are not enabled.')}

const hbCompactBillDetail=detail;detail=function(id){hbCompactBillDetail(id);document.querySelectorAll('.body .note').forEach(n=>{if(n.textContent.includes('All actions are shared local demo events')){n.textContent='Demo record · Payment and service completion are tracked separately.';n.classList.add('hbCompactNotice')}})};
</script></body></html>
