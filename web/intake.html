<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Patient intake · HealthQR</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f5fa;color:#25384f;font:14px system-ui}.wrap{width:min(460px,100%);margin:auto;background:white;min-height:100dvh;padding:20px}h1{font-size:23px;margin:12px 0}.brand{font-weight:750;color:#426dff}.context{padding:12px;background:#f4f8ff;border-radius:13px;font-size:12px;line-height:1.6}label{display:block;font-size:12px;margin:12px 0 5px}input,select,button{width:100%;font:inherit;padding:11px;border-radius:11px;border:1px solid #dfe7f1;color:inherit}input[type=checkbox]{width:16px;height:16px;padding:0;vertical-align:middle}.consent{display:flex;align-items:flex-start;gap:8px;line-height:1.5}.consent input{flex:0 0 16px;margin-top:2px}button{background:#426dff;color:white;border:0;margin-top:15px;font-weight:650}.note{font-size:11px;color:#7d8ea5;line-height:1.6}.status{padding:9px 0;color:#345e96;font-size:13px;overflow-wrap:anywhere}[hidden]{display:none}html,body{height:100%;overflow:hidden}body{display:grid;place-items:center}.wrap{width:min(410px,100vw)!important;height:100dvh;min-height:0!important;max-height:100dvh;overflow-x:hidden;overflow-y:auto;padding:16px}form{display:block!important}form>div{width:100%}.full{grid-column:auto!important}@media(min-width:600px){.wrap{height:min(860px,calc(100dvh - 32px));border-radius:26px;box-shadow:0 15px 45px #20304d13}}</style></head><body><main class="wrap"><div class="brand">HealthQR · Patient intake</div><h1>Connect to care</h1><div class="context" id="context">Checking your link…</div><form id="intakeForm" hidden><div><label for="name">Patient name</label><input id="name" required maxlength="80" autocomplete="name"></div><div><label for="phone">Mobile number</label><input id="phone" required type="tel" pattern="[6-9][0-9]{9}" maxlength="10" inputmode="numeric" autocomplete="tel"></div><div><label for="gender">Gender (optional)</label><select id="gender"><option value="">Prefer not to say</option><option>Female</option><option>Male</option><option>Other</option></select></div><div><label for="problem">Reason / specialty</label><input id="problem" required maxlength="120"></div><label class="consent full"><input id="consent" type="checkbox" required><span>I consent to sharing these details with the named doctor and selected hospital for care coordination.</span></label><p class="note full">Reference number is generated automatically. This local demo is for sample details only; it does not book a confirmed appointment, process payment or provide emergency assistance.</p><button class="full" id="submit" type="submit">Submit patient details</button></form><div class="status" id="status" role="status"></div></main><script>
const token=new URLSearchParams(location.search).get('token')||'',submissionId=crypto.randomUUID?crypto.randomUUID():'intake-'+Date.now()+'-'+Math.random().toString(36).slice(2);const el=id=>document.getElementById(id);async function load(){try{const r=await fetch('/api/intake/'+encodeURIComponent(token)),d=await r.json();if(!r.ok)throw Error(d.error);el('context').textContent='Doctor: '+d.doctor+' · '+d.hospital;el('intakeForm').hidden=false}catch(e){el('context').textContent=e.message}}el('intakeForm').onsubmit=async e=>{e.preventDefault();el('submit').disabled=true;try{const r=await fetch('/api/intake/'+encodeURIComponent(token),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({submissionId,name:el('name').value.trim(),phone:el('phone').value,gender:el('gender').value,problem:el('problem').value.trim(),consent:el('consent').checked})}),d=await r.json();if(!r.ok)throw Error(d.error);el('intakeForm').hidden=true;el('status').textContent='Submitted successfully. Your reference: '+d.referenceNumber+'. The doctor and hospital can now view this request.'}catch(e){el('status').textContent=e.message;el('submit').disabled=false}};load();
</script></body></html>
