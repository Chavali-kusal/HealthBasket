function animateCar(picked){clearInterval(driveTimer);let car=document.getElementById('movingCar');if(!car)return;let t=picked?48:4,dir=1;function frame(){if(!car)return;let x=82+(268*t/100),y=372-(262*t/100)+Math.sin(t/10)*18;car.style.left=`${x}px`;car.style.top=`${y}px`;car.style.transform=`translate(-50%,-50%) rotate(${dir>0?-28:150}deg)`;t+=picked?.22:.16;if(t>96)t=picked?48:4}frame();driveTimer=setInterval(frame,45)}

let toastTimer=null;
function closeTransientUI(){
  if(toastTimer){clearTimeout(toastTimer);toastTimer=null;}
  document.querySelectorAll('.toast,.modalOverlay').forEach(el=>el.remove());
}
function toast(t,ms=2200){
  closeTransientUI();
  const host=document.querySelector('.app')||document.body;
  const e=document.createElement('div');
  e.className='toast';
  e.setAttribute('role','status');
  e.innerHTML=`<span class="toastIcon">✓</span><span class="toastText">${t}</span><button class="toastClose" aria-label="Close notification">×</button>`;
  e.querySelector('.toastClose').onclick=()=>{if(toastTimer)clearTimeout(toastTimer);toastTimer=null;e.remove()};
  host.append(e);
  requestAnimationFrame(()=>e.classList.add('show'));
  toastTimer=setTimeout(()=>{e.classList.remove('show');setTimeout(()=>e.remove(),180)},ms);
}

function book(){clearInterval(driveTimer);shell(`<section class="screen appPage"><div class="head"><button class="back" onclick="home()">‹</button><h2>Book an Ambulance</h2><button class="emergency" onclick="toast('Emergency priority enabled')">✚ Emergency</button></div><div class="seg"><button class="on">From Home</button><button>From Hospital</button></div><div class="routeCard"><button class="point" onclick="locationFlow('pickup')"><i class="dot"></i><div><small>Pickup location</small><b>${data.pickup}</b></div><span>›</span></button><div class="routeLine"></div><button class="point" onclick="locationFlow('drop')"><i class="dot red"></i><div><small>Destination hospital</small><b>${data.drop}</b></div><span>›</span></button></div><div class="sectionTitle"><h3>Nearby ambulances</h3><span class="link">Live demo</span></div><div class="nearbyCars"><button class="${selected==='BLS'?'selected':''}" onclick="selected='BLS';book()"><span>🚑</span><div><b>BLS · 6 min</b><small>2.3 km · Basic care</small></div><strong>₹1</strong></button><button class="${selected==='ALS'?'selected':''}" onclick="selected='ALS';book()"><span>🚑</span><div><b>ALS · 9 min</b><small>3.8 km · Advanced care</small></div><strong>₹1</strong></button><button class="${selected==='ICU'?'selected':''}" onclick="selected='ICU';book()"><span>🚑</span><div><b>ICU · 12 min</b><small>5.1 km · Ventilator</small></div><strong>₹1</strong></button></div><button class="familyStrip" onclick="familyPicker()"><span>👤</span><div><small>AMBULANCE FOR</small><b>${familyMember}</b></div><i>Change ›</i></button><button class="cta" onclick="dispatchOffers()">Find nearest ${selected} →</button></section>${nav('home')}`)}
function dispatchOffers(){shell(`<section class="screen appPage"><div class="head"><button class="back" onclick="book()">‹</button><h2>Driver requests</h2></div><div class="radar compactRadar"><span>🚑</span></div><div class="center"><h2>Contacting nearby ambulances</h2><p>Drivers can accept or pass the request.</p></div><div class="driverOffers"><div><span>👨🏽‍✈️</span><div><b>Ramesh Kumar · 4.8</b><small>${selected} · 2.3 km · 6 min</small></div><i class="pending">Notified</i></div><div><span>👨‍✈️</span><div><b>Arun · 4.7</b><small>${selected} · 3.1 km · 8 min</small></div><i class="reject">Passed</i></div></div></section>${nav('home')}`);setTimeout(()=>driverAccepted(),1500)}
function driverAccepted(){let pin=Math.floor(1000+Math.random()*9000);data.tripPin=pin;shell(`<section class="screen appPage"><div class="acceptedHero"><span>✓</span><small>DRIVER ACCEPTED</small><h2>Ramesh is on the way</h2><p>6 min · ${data.vehicle}</p></div><div class="pinCard"><small>START TRIP PIN</small><b>${pin}</b><p>Share this PIN only when the ambulance arrives.</p></div><div class="driverAcceptCard"><span>👨🏽‍✈️</span><div><b>${data.driver}</b><small>★ ${data.rating} · ${selected} Ambulance</small></div><a href="tel:+91${data.driverPhone}">☎ Call</a></div><div class="detailActions"><button onclick="shareTrip()">Share trip</button><button onclick="tracking(false)">Track ambulance</button></div></section>${nav('home')}`)}
function shareTrip(){let txt=`HealthBasket trip: ${data.driver}, ${data.vehicle}, ETA ${data.eta} min, PIN ${data.tripPin||'----'}`;if(navigator.share)navigator.share({title:'HealthBasket Ambulance Trip',text:txt}).catch(()=>{});else{navigator.clipboard?.writeText(txt);toast('Trip details copied')}}
function tracking(picked){rideProgress=picked?1:0;shell(`<section class="screen trackingScreen">${mapMarkup(picked)}<div class="sheet"><div class="driver"><div class="face">👨🏽‍✈️</div><div class="d"><b>${data.driver}</b><br><small>⭐ ${data.rating} · ${data.vehicle}<br>${selected} Ambulance</small></div><a class="callBtn" href="tel:+91${data.driverPhone}">☎<small>Call</small></a></div><div class="tripPinMini">PIN <b>${data.tripPin||'----'}</b><button onclick="shareTrip()">Share trip</button></div><div class="timeline"><div class="tl done"><i>✓</i>Assigned</div><div class="tl done"><i>✓</i>Arriving</div><div class="tl ${picked?'done':''}"><i>${picked?'✓':'3'}</i>Picked up</div><div class="tl"><i>4</i>Hospital</div></div><div class="actions"><button class="cancel" onclick="cancelTrip()">Cancel</button><button class="share" onclick="${picked?'completeRating()':'tracking(true)'}">${picked?'At Hospital':'Simulate Pickup'}</button></div></div></section>`);animateCar(picked)}
function completeRating(){clearInterval(driveTimer);shell(`<section class="screen successScreen"><div class="successOrb">✓</div><small>TRIP COMPLETED</small><h1>Patient handover complete.</h1><p>${data.drop}</p><div class="ratingBox"><b>Rate your ambulance experience</b><div>${[1,2,3,4,5].map(x=>`<button onclick="finishTrip(${x})">★</button>`).join('')}</div></div><div class="receiptCard"><div><span>Booking fee</span><strong>₹1</strong></div><div><span>Payment</span><strong>Demo ledger</strong></div></div></section>`)}

let selectedPayMethod='UPI', pendingPayment=null;
function paymentsCenter(){activeNav='profile';shell(`<section class="screen appPage">${pageHead('Payments & Receipts','HealthBasket Pay')}<div class="checkoutSummary"><small>PAYMENT METHODS</small><h2>Simple, secure demo checkout.</h2><div class="row"><span>Default method</span><b>${selectedPayMethod}</b></div></div><div class="payMethods"><button class="${selectedPayMethod==='UPI'?'selected':''}" onclick="selectedPayMethod='UPI';paymentsCenter()"><span>◉</span><div><b>UPI</b><small>kusalarao@upi · Demo</small></div><i>${selectedPayMethod==='UPI'?'✓':'›'}</i></button><button class="${selectedPayMethod==='Card'?'selected':''}" onclick="selectedPayMethod='Card';paymentsCenter()"><span>▣</span><div><b>Card</b><small>•••• 4242 · Demo</small></div><i>${selectedPayMethod==='Card'?'✓':'›'}</i></button><button class="${selectedPayMethod==='Cash'?'selected':''}" onclick="selectedPayMethod='Cash';paymentsCenter()"><span>₹</span><div><b>Cash / Pay at service</b><small>Where available</small></div><i>${selectedPayMethod==='Cash'?'✓':'›'}</i></button></div><h3 class="miniHeading">Recent receipts</h3><div class="paymentHistory"><div><div><b>Doctor Appointment</b><small>HB26091214 · Demo</small></div><strong>₹499</strong></div><div><div><b>Lab · Full Body Check</b><small>HB26090820 · Demo</small></div><strong>₹999</strong></div></div></section>${nav('profile')}`)}

function finishUniversalPayment(){if(!pendingPayment)return home();const p=pendingPayment;if(p.after==='ambulance'){toast('₹1 demo payment authorised');setTimeout(dispatchOffers,450);return}let id='HB'+Date.now().toString().slice(-8);data.bookings.unshift({id,type:p.type,when:'17 Sep 2026 · 10:30 AM',status:'Upcoming',place:p.item});shell(`<section class="screen successScreen"><div class="successOrb">✓</div><small>PAYMENT SUCCESSFUL · DEMO</small><h1>Booking confirmed.</h1><p>${p.item} is now in My Bookings.</p><div class="receiptCard"><div><small>RECEIPT</small><b>${id}</b></div><div><span>Amount</span><strong>${p.price}</strong></div><div><span>Payment</span><strong>${selectedPayMethod} · Demo</strong></div><button onclick="toast('Demo receipt downloaded')">↓ Download receipt</button></div><div class="confirmActions"><button onclick="bookings()">My Bookings</button><button onclick="home()">Home</button></div></section>`)}

ick="hb51Pay()">Proceed to payment →</button>`:'';

function hbfPaymentRoute(p){

  if(s.includes('ambulance')) return ()=>book();

  if(s.includes('lab')) return ()=>shop25('labs');
  if(s.includes('pharmacy')||s.includes('medicine')||i.includes('medicine')) return ()=>shop25('pharmacy');

// Location selection uses real GPS / searched coordinates, never an address-derived guess.
function hbPickupEditor(auto=false){const old=hbPickup();HBU.loc=old?{...old,confirmed:false}:{lat:null,lng:null,address:'',confirmed:false,source:null};shell(`<section class="screen appPage hbLocationForm"><div class="head"><button class="back" onclick="book()">‹</button><h2>Confirm pickup pin</h2></div><button class="hbLocBtn" onclick="hbLocate()">⌖ Use my current location</button><label for="hbAddress">Pickup address or landmark</label><form class="hbSearchPair" onsubmit="event.preventDefault();hbSearchAddress()"><input id="hbAddress" autocomplete="off" placeholder="Street, area, city" value="${hbe(old?.address||'')}" oninput="hbAddressChanged()"><button id="hbSearchButton" type="submit">Find on map</button></form><div id="hbLocationStatus" role="status" class="hbHelp">${old?'Your saved pin is shown. Confirm it or search a different address.':'Use GPS or search an address, choose a result, then confirm the pin.'}</div><div id="hbLocationResults"></div><div class="hbActualMap" id="hbActualMap"><div class="hbMapTiles"></div><span class="hbMapCaption">${old?'Drag map to adjust pickup':'No location selected yet'}</span><span class="hbMapPin" ${old?'':'hidden'}>📍</span><div class="hbMapZoom"><button onclick="hbMapZoom(1)" aria-label="Zoom in">+</button><button onclick="hbMapZoom(-1)" aria-label="Zoom out">−</button></div><a class="hbAttribution" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap contributors</a><span class="hbMapStatus" ${old?'':'hidden'}>Map tiles require internet. Coordinates below remain the selected point.</span></div><div class="hbCoords"><div><label for="hbLat">Latitude · automatic</label><input id="hbLat" readonly value="${old?old.lat.toFixed(6):''}" placeholder="Not selected"></div><div><label for="hbLng">Longitude · automatic</label><input id="hbLng" readonly value="${old?old.lng.toFixed(6):''}" placeholder="Not selected"></div></div><button class="cta" id="hbConfirmPin" onclick="hbConfirmPickup()" ${old?'':'disabled'}>Confirm this pickup pin →</button><p class="hbHelp" style="font-size:9px">Address searches are sent to OpenStreetMap Nominatim only when you tap “Find on map”. <a href="https://operations.osmfoundation.org/policies/nominatim/" target="_blank" rel="noopener">Usage policy</a>: light, user-triggered searches; no autocomplete. Internet required. GPS needs permission and usually HTTPS or localhost.</p></section>${nav('home')}`);HBU.mapZoom=16;if(old)hbDrawMap();hbMapBind();if(auto)hbLocate()}
function hbLocStatus(t){const e=document.getElementById('hbLocationStatus');if(e)e.textContent=t}
function hbAddressChanged(){HBU.locationSeq++;HBU.loc.confirmed=false;HBU.loc.address=document.getElementById('hbAddress').value;HBU.loc.source=null;document.getElementById('hbConfirmPin').disabled=true;document.getElementById('hbLat').value='';document.getElementById('hbLng').value='';document.getElementById('hbLocationResults').innerHTML='';hbLocStatus('Address changed. Tap Find on map and choose a matching place before confirming.');}
function hbLocate(){const id=++HBU.locationSeq;hbLocStatus('Finding current location… allow the browser permission request.');if(!navigator.geolocation)return hbLocStatus('GPS unavailable. Search your address instead.');navigator.geolocation.getCurrentPosition(p=>{if(id!==HBU.locationSeq||!document.getElementById('hbAddress'))return;const c=p.coords;hbSetPin(c.latitude,c.longitude,`Current location · ${c.latitude.toFixed(5)}, ${c.longitude.toFixed(5)}`,'gps');hbLocStatus(`GPS detected (accuracy about ${Math.round(c.accuracy)} m). Check the pin and confirm pickup. Address field is filled automatically.`)},e=>{if(id!==HBU.locationSeq)return;hbLocStatus(e.code===1?'Location permission denied. Type an address and tap Find on map.':'GPS unavailable or timed out. Search an address to choose your pickup pin.');},{enableHighAccuracy:true,timeout:9000,maximumAge:15000})}
async function hbSearchAddress(){const q=document.getElementById('hbAddress').value.trim();if(q.length<4)return hbLocStatus('Enter a street / landmark and city (at least 4 characters).');if(HBU.searchBusy)return;if(Date.now()-HBU.lastSearch<1100)return hbLocStatus('Please wait a moment before searching again.');if(location.protocol==='file:')return hbLocStatus('For online address search, open with the included START_LOCAL_WINDOWS.bat (localhost), or use an HTTPS host. GPS may still work when opening the file directly.');HBU.searchBusy=true;HBU.lastSearch=Date.now();const token=++HBU.locationSeq;const btn=document.getElementById('hbSearchButton');btn.disabled=true;const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),10000);hbLocStatus('Searching for matching places…');try{let cache=HBU.searchCache||(HBU.searchCache=new Map());let rows=cache.get(q);if(!rows){const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=4&q='+encodeURIComponent(q),{signal:controller.signal,referrerPolicy:'strict-origin-when-cross-origin'});if(!r.ok)throw Error('Search unavailable');rows=await r.json();cache.set(q,rows)}if(token!==HBU.locationSeq||!document.getElementById('hbLocationResults'))return;HBU.results=rows.filter(r=>Number.isFinite(Number(r.lat))&&Number.isFinite(Number(r.lon)));document.getElementById('hbLocationResults').innerHTML=HBU.results.map((r,i)=>`<button class="hbSearchResult" onclick="hbChooseSearch(${i})">⌖ ${hbe(r.display_name)}</button>`).join('');hbLocStatus(HBU.results.length?'Choose the matching place below. The map and coordinates will update.':'No matching place. Add your city, landmark or postal code and search again.')}catch(e){if(token===HBU.locationSeq)hbLocStatus('Address search could not connect. Check internet and try again, or use GPS. No coordinates have been guessed.')}finally{clearTimeout(timeout);HBU.searchBusy=false;if(document.contains(btn))btn.disabled=false}}
function hbChooseSearch(i){const r=HBU.results[i];if(!r)return;hbSetPin(Number(r.lat),Number(r.lon),r.display_name,'search');document.getElementById('hbLocationResults').innerHTML='';hbLocStatus('Place found. Check or adjust the pin, then tap Confirm this pickup pin.')}
function hbSetPin(lat,lng,address,source){if(!Number.isFinite(lat)||!Number.isFinite(lng)||Math.abs(lat)>85.05||Math.abs(lng)>180)return hbLocStatus('Unsupported coordinates. Choose a valid pickup location.');HBU.locationSeq++;HBU.loc={lat,lng,address,source,confirmed:false};document.getElementById('hbAddress').value=address;document.getElementById('hbLat').value=lat.toFixed(6);document.getElementById('hbLng').value=lng.toFixed(6);document.getElementById('hbConfirmPin').disabled=false;document.querySelector('.hbMapPin').hidden=false;document.querySelector('.hbMapCaption').textContent='Drag map to adjust pickup pin';hbDrawMap()}
function hbWorld(lat,lng,z){const n=256*2**z,s=Math.sin(lat*Math.PI/180);return{x:(lng+180)/360*n,y:(.5-Math.log((1+s)/(1-s))/(4*Math.PI))*n}}
function hbLatLng(x,y,z){const n=256*2**z;return{lat:Math.atan(Math.sinh(Math.PI*(1-2*y/n)))*180/Math.PI,lng:((x/n*360+180)%360+360)%360-180}}
function hbDrawMap(){const map=document.getElementById('hbActualMap');if(!map||HBU.loc.lat==null)return;const target=map.querySelector('.hbMapTiles'),note=map.querySelector('.hbMapStatus');if(location.protocol==='file:'){target.innerHTML='';note.hidden=false;note.textContent='Live street map needs localhost / HTTPS. Use START_LOCAL_WINDOWS.bat. GPS coordinates are still shown below.';return}note.hidden=true;const z=HBU.mapZoom,pt=hbWorld(HBU.loc.lat,HBU.loc.lng,z),w=map.clientWidth,h=map.clientHeight,n=2**z;let html='';for(let x=Math.floor((pt.x-w/2)/256);x<=Math.floor((pt.x+w/2)/256);x++)for(let y=Math.floor((pt.y-h/2)/256);y<=Math.floor((pt.y+h/2)/256);y++){if(y<0||y>=n)continue;html+=`<img draggable="false" alt="" src="https://tile.openstreetmap.org/${z}/${((x%n)+n)%n}/${y}.png" style="left:${x*256-pt.x+w/2}px;top:${y*256-pt.y+h/2}px" onerror="hbTileError()">`}target.innerHTML=html}
function hbTileError(){const n=document.querySelector('.hbMapStatus');if(n){n.hidden=false;n.textContent='Street tiles could not load. Check internet; the selected coordinates remain accurate to the chosen point.'}}
function hbMapZoom(d){if(HBU.loc.lat==null)return;HBU.mapZoom=Math.max(4,Math.min(19,HBU.mapZoom+d));hbDrawMap()}
function hbMapBind(){const m=document.getElementById('hbActualMap');let drag=null;m.addEventListener('pointerdown',e=>{if(e.target.closest('button,a')||HBU.loc.lat==null||!HBU.loc.source)return;drag={x:e.clientX,y:e.clientY,p:hbWorld(HBU.loc.lat,HBU.loc.lng,HBU.mapZoom)};m.setPointerCapture(e.pointerId)});m.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)<4)return;const c=hbLatLng(drag.p.x-dx,drag.p.y-dy,HBU.mapZoom);if(Math.abs(c.lat)>85)return;hbSetPin(c.lat,c.lng,`Pinned pickup · ${c.lat.toFixed(5)}, ${c.lng.toFixed(5)}`,'map');hbLocStatus('Pin adjusted. Confirm this pickup location.')});m.addEventListener('pointerup',()=>drag=null);m.addEventListener('pointercancel',()=>drag=null)}

function c2login(){C2route='login';c2page('Sign in',`<div class="c2authMark">✚</div><h1 style="font-size:27px;line-height:1.15;margin:20px 0 8px">Care starts<br>with you.</h1><p class="c2thin">Welcome to HealthBasket. Sign in or create your customer profile.</p><form id="c2loginForm" onsubmit="event.preventDefault();c2sendOTP()"><label for="c2name" class="c2label">Your name</label><input class="c2input" id="c2name" maxlength="40" required placeholder="Enter your name" value="${hbe(C2.user?.name||'')}"><label class="c2label" for="c2phone">Mobile number</label><input class="c2input" id="c2phone" type="tel" inputmode="numeric" maxlength="10" pattern="[6-9][0-9]{9}" required placeholder="10-digit Indian mobile" value="${hbe(C2.user?.phone||'')}"><label class="c2check"><input type="checkbox" required id="c2consent">I understand this is a local demo sign-in, not secure production authentication.</label><p class="c2status" id="c2error" role="status"></p><button class="c2btn" type="submit">Get demo OTP →</button></form><p class="c2thin">No SMS is sent. Use sample details only.</p>`,'',{auth:true,cls:'c2auth',nohead:true})}
function c2sendOTP(){const f=c2get('c2loginForm');if(!f.reportValidity())return;const name=c2get('c2name').value.trim();if(!name)return c2status('Enter your name.');C2auth={name,phone:c2get('c2phone').value,expires:Date.now()+120000,attempts:0};c2verifyPage()}
function c2verifyPage(){c2page('Verify mobile',`<div class="c2authMark">✓</div><h1 style="font-size:25px;margin:20px 0 8px">One small step.</h1><p class="c2thin">Demo code for ${hbe(C2auth.phone)}. No SMS is sent.</p><div class="c2otp" style="margin:20px 0">1234</div><label class="c2label" for="c2otp">Enter demo OTP</label><input class="c2input" id="c2otp" inputmode="numeric" maxlength="4" autocomplete="one-time-code" placeholder="4-digit code"><p id="c2error" class="c2status" role="status"></p><button class="c2btn" onclick="c2verifyLogin()">Verify & continue →</button><button class="c2tools" onclick="C2auth.expires=Date.now()+120000;C2auth.attempts=0;c2status('New demo code: 1234')">Resend demo code</button>`,'',{auth:true,cls:'c2auth',back:'c2login()'})}
function c2verifyLogin(){if(Date.now()>C2auth.expires)return c2status('Code expired. Resend the demo code.');if(C2auth.attempts>=5)return c2status('Too many attempts. Resend to restart this demo.');if(c2get('c2otp').value!=='1234'){C2auth.attempts++;return c2status('Enter the demo code 1234.')}C2.user={name:C2auth.name,phone:C2auth.phone};C2.loggedIn=true;c2save();home()}
home=function(){if(!C2.loggedIn)return c2login();C2route='home';activeNav='home';hb51Stop();const name=C2.user?.name||'there';shell(`<section class="c2page c2home"><div class="c2brand"><button class="hbCircle" onclick="profile()" aria-label="Profile">${hbSvg('menu')}</button><div class="hbWordmark">Health<em>Basket</em><small>YOUR EVERYDAY CARE</small></div><button class="hbCircle" onclick="c2updates()" aria-label="Notifications">${hbSvg('bell')}</button></div><div class="c2greet"><div><small>Hello, ${hbe(name)}</small><h1>Care for your every day.</h1></div><span>How can we help?</span></div><div><div class="hbMiniBanner" onmouseenter="clearInterval(HBU.timer)" onmouseleave="hbBannerStart()"><div class="hbBannerTrack">${[['online','ONLINE CONSULTATION','Your doctor. Your time.','Request care at your selected hospital.'],['ambulance','AMBULANCE ASSISTANCE','A safer journey to care.','Fare estimate before you request.'],['labs','HOME LAB SERVICES','Care comes to you.','Upload a prescription. We do the rest.']].map(([k,s,t,p])=>`<button class="hbBannerSlide" onclick="c2open('${k}')"><div><small>${s}</small><b>${t}</b><p>${p}</p></div><span>${hbSvg(k)}</span></button>`).join('')}</div><button class="hbArrow prev" aria-label="Previous banner" onclick="hbBannerMove(-1)">‹</button><button class="hbArrow next" aria-label="Next banner" onclick="hbBannerMove(1)">›</button></div><div class="hbBannerDots">${[0,1,2].map(i=>`<button aria-label="Banner ${i+1}" onclick="HBU.banner=${i};hbBannerRender();hbBannerStart()"></button>`).join('')}</div></div><div class="hbTitle"><h2>Your healthcare services</h2><small>Choose a service</small></div><div class="c2homeGrid">${C2services.map(([k,t,s])=>`<button class="c2homeTile" onclick="c2open('${k}')"><span class="hbServiceIcon">${hbSvg(k)}</span><span><b>${t}</b><small>${s}</small></span>${k==='packages'?'<span>›</span>':''}</button>`).join('')}</div><div class="c2homeFooter">CUSTOMER PREVIEW · NO REAL PAYMENTS OR DISPATCH</div></section>${nav('home')}`);hbBannerRender();hbBannerStart()};
function c2open(k){if(!C2.loggedIn)return c2login();if(k==='offers')return c2offers();if(k==='packages')return c2packages();if(k==='online')return c2online();if(k==='ambulance')return c2ambulance();C2draft={type:k,patient:C2.user.name};C2file=null;if(C2fileURL)URL.revokeObjectURL(C2fileURL);C2fileURL=null;c2request(1)}

function c2revisit(id){const v=C2.visits.find(v=>v.doctorId===id);if(!v)return;C2draft={type:'online',patient:C2.user.name,hospital:v.hospital,doctor:v.name,doctorId:v.doctorId,specialty:v.specialty};c2onlineForm()}
function c2onlineForm(){c2page(C2draft.doctor?'Book follow-up':'New consultation',`<form id="c2onlineForm">${c2hospital(C2draft.hospital)}<label class="c2label" for="c2specialty">Specialty</label><select id="c2specialty" class="c2input">${['General medicine','Cardiology','Orthopaedics','Dermatology'].map(s=>`<option ${s===C2draft.specialty?'selected':''}>${s}</option>`).join('')}</select>${C2draft.doctor?`<div class="c2note">Preferred doctor: ${hbe(C2draft.doctor)}</div>`:''}<div class="c2columns"><div><label class="c2label" for="c2patient">Patient</label><input id="c2patient" class="c2input" required maxlength="60" value="${hbe(C2draft.patient||'')}"></div><div><label class="c2label" for="c2date">Preferred date</label><input id="c2date" class="c2input" required type="date" min="${c2today()}" value="${c2today()}"></div></div><label class="c2label" for="c2slot">Preferred time</label><select id="c2slot" class="c2input"><option>09:00 – 11:00</option><option>11:00 – 13:00</option><option>15:00 – 17:00</option></select><label class="c2label" for="c2reason">Reason (optional)</label><input id="c2reason" class="c2input" maxlength="200" placeholder="Brief consultation reason"><p id="c2error" role="status" class="c2status"></p></form><div class="c2note">No charge when raising the request. Hospital confirmation creates the fee and checkout. Real availability is not connected.</div>`,`<button class="c2btn" onclick="c2submitOnline()">Submit consultation request →</button>`,{back:'c2online()'})}
function c2today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function c2submitOnline(){if(!c2get('c2onlineForm').reportValidity())return;const patient=c2get('c2patient').value.trim();if(!patient)return c2status('Enter a patient name.');const o=c2new({...C2draft,patient,hospital:c2get('c2hospital').value,specialty:c2get('c2specialty').value,date:c2get('c2date').value,slot:c2get('c2slot').value,reason:c2get('c2reason').value,stage:'requested',paymentStatus:'Not requested',amount:null});c2event(o,'Consultation request recorded; waiting for hospital confirmation');c2detail(o.id)}

function c2request(step){const type=C2draft.type,title={pharmacy:'Pharmacy delivery',labs:'Home lab service',doctor:'Physician service'}[type];if(step===1){c2page(title,`<form id="c2rxForm">${c2hospital(C2draft.hospital)}<label class="c2label" for="c2patient">Patient name</label><input id="c2patient" class="c2input" required maxlength="60" value="${hbe(C2draft.patient||C2.user.name)}"><label class="c2label">Upload doctor prescription</label><div class="c2file"><input id="c2rx" type="file" accept="image/jpeg,image/png,image/webp,application/pdf" onchange="c2readFile(this)"><p>Photo or PDF · up to 10 MB<br>No need to read the doctor's handwriting.</p><div id="c2filePreview">${C2file?`<p>Selected: ${hbe(C2file.name)}</p>`:''}</div></div><label class="c2label" for="c2description">Description (optional)</label><textarea id="c2description" class="c2input" rows="2" maxlength="300" placeholder="Anything the provider should know">${hbe(C2draft.description||'')}</textarea><p id="c2error" role="status" class="c2status"></p></form>`,`<button class="c2btn" onclick="c2rxNext()">Continue · delivery address →</button>`,{steps:1});return}

c2page('Review your request',`<div class="c2card"><h2>${title}</h2><p>${hbe(C2draft.hospital)}<br>For ${hbe(C2draft.patient)}</p><p>Prescription: ${hbe(C2file?.name||'')}<br>${hbe(C2draft.address)}<br>${hbe(C2draft.date)} · ${hbe(C2draft.slot)}</p></div><div class="c2card"><h2>Cash on delivery / after service</h2><p>No fixed upfront amount. After delivery/service, the provider enters the actual bill. Pay cash or request a digital payment link then.</p><span class="c2tag green">No payment now</span></div><div class="c2note">Completion OTP verifies handover/service separately from payment. This preview stores only file metadata; selected prescription bytes are not uploaded or retained.</div>`,`<button class="c2btn" onclick="c2submitRX()">Submit request · no advance payment</button>`,{steps:3,back:'c2request(2)'})}

// Ambulance: confirmed pickup from the existing real GPS/search map; dispatch remains local.
function c2fare(km){return Math.round((1200+Number(km)*12+100)*100)/100}
function c2ambulance(){C2draft={type:'ambulance',patient:C2.user.name,km:10,hospital:'',vehicle:'BLS'};c2ambulanceForm()}
function c2ambulanceForm(){const p=hbPickup();c2page('Request an ambulance',`<form id="c2ambulanceForm">${c2hospital(C2draft.hospital)}<label class="c2label">Pickup location</label><button type="button" class="c2choice" onclick="c2saveAmbDraft();c2pickup()"><span class="hbServiceIcon">${hbSvg('ambulance')}</span><div class="grow"><b>${hbe(p?.address||'Use GPS / find pickup on map')}</b><small>${p?'Pin confirmed · '+p.lat.toFixed(5)+', '+p.lng.toFixed(5):'Choose a real GPS or searched point'}</small></div><span>›</span></button><div class="c2columns"><div><label class="c2label" for="c2km">Estimated trip distance · km</label><input class="c2input" id="c2km" type="number" min="0.1" max="1000" step="0.1" required value="${C2draft.km}" oninput="c2farePreview()"></div><div><label class="c2label" for="c2vehicle">Vehicle class</label><select id="c2vehicle" class="c2input"><option ${C2draft.vehicle==='BLS'?'selected':''}>BLS</option><option ${C2draft.vehicle==='ALS'?'selected':''}>ALS</option><option ${C2draft.vehicle==='ICU'?'selected':''}>ICU</option></select></div></div><div class="c2card" style="margin-top:12px"><table class="c2table"><tr><td>Base fare</td><td>₹1,200</td></tr><tr><td>Distance · ₹12 / km</td><td id="c2distanceFee">${c2money(C2draft.km*12)}</td></tr><tr><td>Extra services · fixed</td><td>₹100</td></tr><tr><td>Estimated total</td><td id="c2fareTotal">${c2money(c2fare(C2draft.km))}</td></tr></table></div><label class="c2check"><input id="c2dispatchConsent" type="checkbox" required>For the demo dispatch, share pickup address, map coordinates and estimate with nearby sample drivers.</label><p class="c2status" id="c2error" role="status"></p></form><p class="c2thin">Distance is a manual demo estimate, not a live route calculation. Price formula is identical across sample vehicle classes; availability is unverified.</p>`,`<button class="c2btn" onclick="c2requestRide()">Confirm fare & request ambulance →</button>`,{route:'ambulance'})}
function c2saveAmbDraft(){if(c2get('c2hospital'))C2draft.hospital=c2get('c2hospital').value;if(c2get('c2km'))C2draft.km=Number(c2get('c2km').value)||10;if(c2get('c2vehicle'))C2draft.vehicle=c2get('c2vehicle').value}
function c2farePreview(){const k=Number(c2get('c2km').value);c2get('c2distanceFee').textContent=c2money(k*12);c2get('c2fareTotal').textContent=c2money(c2fare(k))}
let c2Picking=false;
function c2pickup(){c2Picking=true;hbPickupEditor(!hbPickup());const b=document.querySelector('.hbLocationForm .head .back');if(b)b.onclick=()=>{c2Picking=false;c2ambulanceForm()}}
const c2priorConfirm=hbConfirmPickup;
hbConfirmPickup=function(){if(!c2Picking)return c2priorConfirm();const p=HBU.loc;if(!p||!p.source||!Number.isFinite(p.lat)||!Number.isFinite(p.lng)||!p.address.trim())return hbLocStatus('Select a valid point first.');p.confirmed=true;HBStorage.setItem('confirmedPickup',JSON.stringify(p));c2Picking=false;c2ambulanceForm()};
function c2distance(a,b){const r=x=>x*Math.PI/180,d1=r(b.lat-a.lat),d2=r(b.lng-a.lng),v=Math.sin(d1/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(d2/2)**2;return 6371*2*Math.atan2(Math.sqrt(v),Math.sqrt(1-v))}
function c2drivers(p){return [{id:'DRV-101',name:'Ravi · demo',registeredAddress:'Sample North station',lat:p.lat+.008,lng:p.lng+.006,vehicle:'BLS',verified:true,optIn:true},{id:'DRV-102',name:'Kiran · demo',registeredAddress:'Sample East station',lat:p.lat+.018,lng:p.lng-.012,vehicle:'ALS',verified:true,optIn:true},{id:'DRV-103',name:'Arun · demo',registeredAddress:'Sample South station',lat:p.lat-.028,lng:p.lng+.01,vehicle:'ICU',verified:true,optIn:true}].map(d=>({...d,distanceKm:c2distance(p,d)})).filter(d=>d.distanceKm<=10&&d.optIn&&d.verified)}
function c2requestRide(){if(!c2get('c2ambulanceForm').reportValidity())return;const p=hbPickup();if(!p)return c2status('Confirm your pickup point first.');c2saveAmbDraft();const candidates=c2drivers(p).filter(d=>d.vehicle===C2draft.vehicle);const o=c2new({...C2draft,pickup:p.address,coords:{lat:p.lat,lng:p.lng},amount:c2fare(C2draft.km),fare:{base:1200,perKm:12,km:C2draft.km,extras:100,total:c2fare(C2draft.km)},stage:'dispatching',paymentStatus:'Due after trip',candidates,completionOTP:String(Math.floor(1000+Math.random()*9000)),pickupOTP:String(Math.floor(1000+Math.random()*9000)),shareConsent:true});o.dispatchPreview=candidates.map(d=>({driverId:d.id,to:d.name,status:'Queued · simulation only',message:`AMBULANCE REQUEST ${o.id}\nPickup: ${p.address}\nLatitude: ${p.lat.toFixed(6)}, Longitude: ${p.lng.toFixed(6)}\nMap: https://www.google.com/maps?q=${p.lat},${p.lng}\nDestination: ${o.hospital}\nEstimated fare: INR ${o.amount}\nVehicle: ${o.vehicle}\nAccept this request in the partner app. Demo only.`}));c2event(o,'Dispatch previews queued for '+candidates.length+' opted-in matching sample driver(s); no WhatsApp messages sent');c2ride(o.id)}
function c2ride(id){C2active=id;const o=c2o();if(!o)return bookings();if(o.stage==='completed')return c2detail(id);const labels={dispatching:'Finding your ambulance',assigned:'Driver confirmed',arrived:'Driver at pickup',in_trip:'On the way to hospital',dropped:'Arrived at hospital',cancelled:'Ride cancelled'};const title=labels[o.stage]||'Ambulance';let actions='';if(o.stage==='dispatching')actions=`<button class="c2btn" onclick="c2dispatchPreview()">View WhatsApp dispatch preview</button><button class="c2btn c2secondary" onclick="c2simulateDriverAccept()">Demo: nearby driver accepts</button>`;if(o.stage==='assigned')actions=`<button class="c2btn" onclick="c2rideAdvance('arrived')">Demo: ambulance arrives</button><button class="c2btn c2secondary" onclick="c2shareRide()">Trip share preview</button>`;if(o.stage==='arrived')actions=`<div class="c2otp">${o.pickupOTP}</div><label class="c2label" for="c2pickupOTP">Demo driver enters pickup OTP</label><input id="c2pickupOTP" class="c2input" inputmode="numeric" maxlength="4" placeholder="Enter pickup code"><p id="c2error" class="c2status"></p><button class="c2btn" onclick="c2pickupVerify()">Verify pickup & start trip</button>`;if(o.stage==='in_trip')actions=`<button class="c2btn" onclick="c2rideAdvance('dropped')">Demo: driver confirms hospital drop</button><button class="c2btn c2secondary" onclick="c2shareRide()">Trip share preview</button>`;if(o.stage==='dropped')actions=`<div class="c2note">Trip service ended. Fare collection and handover OTP remain separate.</div><button class="c2btn" onclick="c2pay('${id}','ambulance')">Pay company · ${c2money(o.amount)}</button><button class="c2btn c2secondary" onclick="c2detail('${id}')">View completion / payment status</button>`;
c2page(title,`<div class="c2map">${hb52BaseMap(o.stage==='in_trip'?'to_hospital':o.stage==='arrived'?'arrived':o.stage==='dispatching'?'searching':'accepted')}<span class="c2mapLabel">DEMO MAP · NOT LIVE TRACKING</span><span class="c2mapLive">${o.driver?'Sample driver assigned':'Sample dispatch'}</span></div><div class="c2card"><div class="c2row"><div><h2>${hbe(o.driver?.name||o.vehicle+' request')}</h2><p>${hbe(o.driver?'Vehicle DEMO '+o.driver.id:o.candidates.length+' sample driver candidate(s)')}</p></div><span class="c2tag">${c2money(o.amount)}</span></div><p>Pickup: ${hbe(o.pickup)}<br>Hospital: ${hbe(o.hospital)}</p></div>${actions}<button class="c2tools" onclick="c2safety()">Safety & tracking information</button>${['dispatching','assigned','arrived'].includes(o.stage)?`<button class="c2btn c2danger" onclick="c2cancel('${o.id}')">Cancel request</button>`:''}`,'',{back:'bookings()',active:'bookings',route:'ride'})}
function c2dispatchPreview(){const o=c2o();c2page('Dispatch preview',`<span class="c2tag">NO MESSAGE HAS BEEN SENT</span><div class="c2note">Sample driver registration coordinates are generated around the selected pickup for demo coverage, not a real driver registry. Matching radius: 10 km; opted-in, verified flag and requested vehicle class required.</div>${o.dispatchPreview.length?o.dispatchPreview.map(d=>`<div class="c2card"><h2>${hbe(d.to)}</h2><small>${d.status}</small><pre style="white-space:pre-wrap;font:10px/1.6 inherit;overflow-wrap:anywhere">${hbe(d.message)}</pre></div>`).join(''):'<div class="c2empty">No matching sample drivers. Production needs search expansion or assisted booking.</div>'}`,`<button class="c2btn" onclick="c2ride('${o.id}')">Back to ride request</button>`,{back:`c2ride('${o.id}')`})}
function c2simulateDriverAccept(){const o=c2o();if(o.stage!=='dispatching'||o.driver)return toast('This request has already been assigned.');if(!o.candidates.length)return toast('No matching sample driver.');o.driver=o.candidates[0];o.stage='assigned';c2event(o,'First sample driver acceptance assigned; further acceptance blocked');c2ride(o.id)}
function c2rideAdvance(stage){const o=c2o();const allowed={assigned:'arrived',in_trip:'dropped'};if(allowed[o.stage]!==stage)return; o.stage=stage;if(stage==='dropped')o.serviceDoneAt=new Date().toISOString();c2event(o,stage==='arrived'?'Sample driver arrived at pickup':'Hospital drop recorded in demo');c2ride(o.id)}
function c2pickupVerify(){const o=c2o();if(o.stage!=='arrived')return;if(c2get('c2pickupOTP').value!==o.pickupOTP)return c2status('Pickup OTP does not match.');o.stage='in_trip';c2event(o,'Pickup OTP verified in demo; trip started');c2ride(o.id)}
function c2shareRide(){const o=c2o();c2page('Trip share preview',`<div class="c2card"><h2>${hbe(o.id)}</h2><p>${hbe(o.driver?.name||'Driver pending')}<br>${hbe(o.hospital)}</p><p>Pickup: ${hbe(o.pickup)}</p><p>Share links in production must be expiring, revocable, consent-based and scoped to this trip.</p></div><div class="c2note">No public tracking link is generated in this local demo. No message is sent.</div>`,`<button class="c2btn" onclick="c2ride('${o.id}')">Back to trip</button>`,{back:`c2ride('${o.id}')`})}
function c2safety(){const o=c2o();c2page('Safety & tracking',`<div class="c2card"><h2>Check the vehicle before pickup</h2><p>Compare driver/vehicle details and share pickup OTP only after the ambulance arrives.</p></div><div class="c2card"><h2>Tracking is simulated here</h2><p>This preview has no real driver GPS, verified driver identity, ambulance dispatch or emergency response. Security badges are demo status labels.</p></div><div class="c2card"><h2>Production protection planned</h2><p>Verified drivers, authenticated fresh GPS with stale-location warning, expiring share links, emergency support, trip audit logs and server-side OTP checks.</p></div>`,`<button class="c2btn" onclick="c2ride('${o.id}')">Back to trip</button>`,{back:`c2ride('${o.id}')`})}
// Unified local order detail, provider simulation and completion/payment states.
function c2title(o){return o.title||C2services.find(x=>x[0]===o.type)?.[1]||'Service request'}
function c2stage(o){return ({requested:'Request submitted',accepted:'Provider accepted',priced:'Fee confirmed',ready:'Service / handover ready',dispatching:'Matching drivers',assigned:'Driver assigned',arrived:'Driver arrived',in_trip:'Trip in progress',dropped:'Hospital drop recorded',completed:'Completed',cancelled:'Cancelled',interest:'Interest recorded'})[o.stage]||o.stage}
bookings=function(filter='all'){if(!C2.loggedIn)return c2login();C2view=filter;const list=C2.orders.filter(o=>filter==='all'||(filter==='completed'?o.stage==='completed':!['completed','cancelled','interest'].includes(o.stage)));c2page('My requests',`<div class="chips" style="margin-bottom:12px">${[['all','All'],['active','Active'],['completed','Completed']].map(([k,n])=>`<button onclick="bookings('${k}')" class="${k===filter?'selected':''}">${n}</button>`).join('')}</div>${list.length?list.map(o=>`<button class="c2choice" onclick="c2detail('${o.id}')"><span class="hbServiceIcon">${hbSvg(o.type)}</span><div class="grow"><b>${hbe(c2title(o))}</b><small>${hbe(c2stage(o))} · ${hbe(o.hospital||'')}</small><small>${hbe(o.paymentStatus)}</small></div><span>›</span></button>`).join(''):'<div class="c2empty">No requests in this category.</div>'}`,'',{active:'bookings',route:'bookings'})};
function c2detail(id){C2active=id;const o=c2o();if(!o)return bookings();let acts='';const rx=['pharmacy','labs','doctor','packages'].includes(o.type);if(o.type==='online'){if(o.stage==='requested')acts=`<button class="c2btn c2secondary" onclick="c2providerAccept()">Demo: hospital confirms doctor & fee</button>`;if(o.stage==='priced'&&o.paymentStatus!=='Paid · simulated')acts=`<button class="c2btn" onclick="c2pay('${id}','consultation')">Pay company · ${c2money(o.amount)}</button>`;if(o.paymentStatus==='Paid · simulated'&&o.stage!=='completed')acts=`<button class="c2btn c2secondary" onclick="c2completeConsultation()">Demo: finish consultation</button>`}
if(rx){if(o.stage==='requested')acts=`<button class="c2btn c2secondary" onclick="c2providerAccept()">Demo: provider accepts prescription / request</button>`;if(o.stage==='accepted')acts=`<button class="c2btn c2secondary" onclick="c2providerReady()">Demo: delivery / service performed</button>`;if(['ready','completed'].includes(o.stage)&&!o.amount)acts=`<button class="c2btn c2secondary" onclick="c2quotePage()">Demo: provider enters actual bill</button>`;if(['ready','completed'].includes(o.stage)&&o.amount&&o.paymentStatus!=='Paid · simulated'&&o.paymentStatus!=='Cash received · simulated')acts=`<button class="c2btn" onclick="c2settlePage()">Pay after service · ${c2money(o.amount)}</button>`;if(o.stage==='ready')acts+=`<button class="c2btn c2secondary" onclick="c2completionPage()">Verify completion OTP</button>`}
if(o.type==='ambulance'){if(!['completed','cancelled'].includes(o.stage))acts=`<button class="c2btn" onclick="c2ride('${id}')">${o.stage==='dropped'?'View trip & pay company':'Open trip tracking'}</button>`;if(o.stage==='dropped')acts+=`<button class="c2btn c2secondary" onclick="c2completionPage()">Verify hospital handover OTP</button>`;if(o.stage==='completed'&&o.paymentStatus!=='Paid · simulated')acts=`<button class="c2btn" onclick="c2pay('${id}','ambulance')">Pay company · ${c2money(o.amount)}</button>`;if(o.stage==='completed'&&o.paymentStatus==='Paid · simulated')acts+=`<button class="c2btn c2secondary" onclick="c2claimPage()">Driver claim / payout status · demo</button>`}
if(o.refundStatus==='Refund requested · simulated')acts+='<button class="c2btn c2secondary" onclick="c2refundComplete()">Demo: confirm refund completion</button>';const cancellable=!['completed','cancelled','ready','dropped','in_trip','interest'].includes(o.stage);const history=(o.history||[]).slice(-4).reverse();c2page(c2title(o),`<div class="c2card"><div class="c2row"><span class="c2tag ${o.stage==='completed'?'green':''}">${c2stage(o)}</span><small>${hbe(o.id)}</small></div><p>${hbe(o.hospital||'')}<br>For ${hbe(o.patient||C2.user.name)}${o.date?'<br>'+hbe(o.date)+' '+hbe(o.slot||''):''}</p>${o.rx?`<p>Prescription: ${hbe(o.rx.name)} · metadata only</p>`:''}${o.address?`<p>${hbe(o.address)}</p>`:''}${o.doctor?`<p>Doctor: ${hbe(o.doctor)}</p>`:''}<div class="c2row" style="margin-top:9px"><span class="c2thin">${hbe(o.paymentStatus)}</span>${o.amount!=null?`<b>${c2money(o.amount)}</b>`:'<span class="c2tag">Bill pending</span>'}</div></div>${acts}${o.stage==='completed'?`<div class="c2note">Service completion OTP: ${o.completionVerified?'verified in demo':'not applicable'}. Payment status remains separate.</div><button class="c2btn c2secondary" onclick="c2receipt()">Download demo summary</button>`:''}${cancellable?`<button class="c2tools" onclick="c2cancel('${id}')">Cancel this request</button>`:''}<div class="c2section"><h2>Recent activity</h2><small>Timestamped</small></div>${history.map(e=>`<div class="c2line done"><i>✓</i><div><b>${hbe(e.text)}</b><small>${new Date(e.at).toLocaleString('en-IN')}</small></div></div>`).join('')}`,'',{back:'bookings()',active:'bookings',route:'detail'})}
function c2providerAccept(){const o=c2o();if(o.stage!=='requested')return;if(o.type==='online'){o.doctor=o.doctor||'Dr. Vikram Dev · demo';o.doctorId=o.doctorId||'demo-vikram';o.amount=o.specialty==='General medicine'?399:599;o.stage='priced';o.paymentStatus='Company payment due';c2event(o,'Sample hospital confirmed doctor and consultation fee')}else{o.stage='accepted';c2event(o,'Sample provider accepted request; no advance collection')}c2detail(o.id)}
function c2providerReady(){const o=c2o();if(o.stage!=='accepted')return;o.stage='ready';o.serviceDoneAt=new Date().toISOString();o.completionOTP=String(Math.floor(1000+Math.random()*9000));c2event(o,'Demo provider recorded delivery/service; customer OTP still required');c2detail(o.id)}
function c2quotePage(){const o=c2o();if(!['ready','completed'].includes(o.stage))return;c2page('Provider bill · demo',`<div class="c2note">Demo provider action after service/delivery. No bill is inferred from handwriting or file upload.</div><label class="c2label" for="c2billAmount">Actual bill amount · INR</label><input id="c2billAmount" class="c2input" type="number" min="1" max="1000000" step="0.01" placeholder="Enter provider bill total" value="${o.amount||''}"><label class="c2label" for="c2billRef">Provider bill reference</label><input id="c2billRef" class="c2input" maxlength="60" placeholder="Bill / invoice reference"><p id="c2error" class="c2status"></p>`,`<button class="c2btn" onclick="c2saveQuote()">Issue demo bill</button>`,{back:`c2detail('${o.id}')`})}

function c21readCode(raw){const s=String(raw||'').trim();let id=s;if(s.startsWith('healthbasket-demo:bill:'))id=s.slice('healthbasket-demo:bill:'.length);if(!/^HBILL-\d{3}$/.test(id)||!C21BILLS.some(b=>b.id===id))return c21scanStatus('Unrecognised or untrusted QR. Use HBILL-001 / HBILL-002. No external link opened.');C21bill=C21BILLS.find(b=>b.id===id);c21billDetail(id)}
function c21samplePage(id='HBILL-001'){const b=C21BILLS.find(b=>b.id===id)||C21BILLS[0];c2page('Sample hospital bill QR',`<label class="c2label" for="c21sampleBill">Hospital / service invoice</label><select class="c2input" id="c21sampleBill" onchange="c21samplePage(this.value)">${C21BILLS.map(x=>`<option value="${x.id}" ${x.id===b.id?'selected':''}>${hbe(x.hospital)} · ${hbe(x.serviceId)}</option>`).join('')}</select><div class="c2card" style="margin-top:12px"><h2>${hbe(b.hospital)}</h2><p>${hbe(b.service)} · bill ${hbe(b.invoice)}</p><div class="c21sampleQR">${C21QRS[b.id]}</div><p style="text-align:center">${b.id} · not a real payment QR</p><button class="c21qrDownload" onclick="c21downloadQR('${b.id}')">Download sample QR image</button></div><button class="c2btn" onclick="c21readCode('${b.id}')">Open sample bill</button><div class="c2note">Hospital/service poster QR identifies a service. A bill QR must identify an issued invoice as well. The server must verify the amount and current bill state before payment.</div>`,'',{active:'qr',back:'c21scan()'})}
function c21downloadQR(id){const url=URL.createObjectURL(new Blob([C21QRS[id]],{type:'image/svg+xml'}));const a=document.createElement('a');a.href=url;a.download=id+'_DEMO_QR.svg';a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}
function c21billDetail(id){const b=C21BILLS.find(b=>b.id===id);if(!b)return c21scan();C21bill=b;const paid=C2.billPayments.find(p=>p.billId===b.id&&p.status==='Paid · simulated'),direct=C2.directClaims.find(c=>c.billId===b.id);const benefit=C2.benefits.find(x=>x.billId===b.id);let actions=paid?`<div class="c2note">Already paid in the app · ${hbe(paid.paymentRef)}<br>No second payment is required.</div><button class="c2btn c2secondary" onclick="c21cashback()">View demo benefit status</button>`:direct?`<div class="c2note">Hospital-direct receipt submitted · ${hbe(direct.status)}. App collection is blocked to avoid duplicate payment while this is reviewed.</div><button class="c2btn c2secondary" onclick="c21directDetail('${direct.id}')">View submitted receipt</button>`:`<button class="c2btn" onclick="c21billCheckout('${b.id}')">Review app payment · ${c2money(b.appRate)}</button><button class="c2btn c2secondary" onclick="c21directPage('${b.id}')">Already paid directly? Submit receipt</button>`;
c2page('Hospital bill details',`<span class="c2tag">SAMPLE BILL · NOT SERVER VERIFIED</span><div class="c2card" style="margin-top:12px"><h2>${hbe(b.hospital)}</h2><p>${hbe(b.service)}<br>Bill: ${hbe(b.invoice)}<br>Reference: ${b.id}</p><table class="c2table c21billtable"><tr><td>Sample general tariff</td><td>${c2money(b.generalTariff)}</td></tr><tr><td>Sample app rate</td><td>${c2money(b.appRate)}</td></tr><tr><td>Rate difference</td><td class="c21save">${c2money(b.generalTariff-b.appRate)}</td></tr></table></div><div class="c2note">Amounts are examples, not a live MOU rate or promised discount. Rate savings are separate from cashback. Real hospital bill validation is required.</div>${actions}${benefit?`<p class="c21proof">Demo benefit: ${benefit.status} · ${c2money(benefit.amount)}</p>`:''}`,'',{active:'qr',back:'c21scan()'})}
function c21billCheckout(id){const b=C21BILLS.find(b=>b.id===id);if(!b)return;if(C2.billPayments.some(p=>p.billId===id&&p.status==='Paid · simulated')||C2.directClaims.some(c=>c.billId===id))return c21billDetail(id);C21bill=b;c2page('Review hospital bill payment',`<div class="c2paymentBrand"><small>COMPANY CHECKOUT · LOCAL DEMO</small><h2>${c2money(b.appRate)}</h2><p>${hbe(b.hospital)}<br>Bill ${hbe(b.invoice)}</p></div><div class="c2card"><h2>Linked to this hospital invoice</h2><p>Bill/service/amount are read from the built-in sample catalogue, never trusted from arbitrary QR text.</p><p>No bank debit, gateway capture or hospital transfer takes place.</p></div><label class="c2check"><input type="checkbox" id="c21notPaid">I have not already paid this bill directly at the hospital.</label><p id="c21payStatus" class="c2status" role="status"></p>`,`<button class="c2btn" id="c21payButton" onclick="c21payBill()">Simulate app collection · ${c2money(b.appRate)}</button>`,{active:'qr',back:`c21billDetail('${id}')`})}
function c21payBill(){const b=C21bill;if(!b||C21busy)return;if(!c2get('c21notPaid').checked){c2get('c21payStatus').textContent='Confirm this bill has not already been paid.';return}if(C2.billPayments.some(p=>p.billId===b.id&&p.status==='Paid · simulated')||C2.directClaims.some(c=>c.billId===b.id))return c21billDetail(b.id);C21busy=true;c2get('c21payButton').disabled=true;const id=b.id;setTimeout(()=>{C21busy=false;if(C2.billPayments.some(p=>p.billId===id&&p.status==='Paid · simulated')||C2.directClaims.some(c=>c.billId===id))return;const p={id:c2id('BILLPAY-DEMO'),billId:id,invoice:b.invoice,hospitalId:b.hospitalId,serviceId:b.serviceId,amount:b.appRate,status:'Paid · simulated',paymentRef:c2id('PAY-DEMO'),collection:'App collection · simulated',settlementStatus:'Not configured · provider agreement required',platformFee:null,at:new Date().toISOString()};C2.billPayments.push(p);const o=c2new({type:'billpay',title:b.service,billId:id,hospital:b.hospital,amount:b.appRate,patient:C2.user.name,stage:'completed',paymentStatus:p.status,companyCollected:b.appRate,paymentRef:p.paymentRef});c2event(o,'Demo bill payment recorded; hospital settlement not assumed');c21pendingBenefit(b.id,p.id,'app');c2save();if(C2.loggedIn&&C2route==='Review hospital bill payment')c21billDetail(id)},450)}
function c21pendingBenefit(billId,sourceId,source){if(C2.benefits.some(x=>x.billId===billId))return;C2.benefits.push({id:c2id('BENEFIT-DEMO'),billId,sourceId,source,amount:50,status:'Pending verification',at:new Date().toISOString(),funding:'Sample company-funded demo credit; no live eligibility scheme'});c2save()}
function c21balances(){return{pending:C2.benefits.filter(b=>b.status==='Pending verification').reduce((s,b)=>s+b.amount,0),available:C2.benefits.filter(b=>b.status==='Verified · demo credit').reduce((s,b)=>s+b.amount,0),claimed:C2.benefits.filter(b=>b.status==='Claimed · simulated').reduce((s,b)=>s+b.amount,0)}}
function c21cashback(){if(!C2.loggedIn)return c2login();const a=c21balances();c2page('Cashback & bill benefits',`<div class="c21amounts"><div class="c21amount"><b>${c2money(a.pending)}</b><small>Pending · demo</small></div><div class="c21amount"><b>${c2money(a.available)}</b><small>Available · demo</small></div><div class="c21amount"><b>${c2money(a.claimed)}</b><small>Claimed · simulated</small></div></div><div class="c2note">This is an illustrative ₹50 credit workflow per sample bill, not a live healthcare cashback offer. Eligibility, funding and terms need review. Hospitals do not redeem customer credits.</div>${C2.benefits.length?C2.benefits.map(x=>`<div class="c2card c21cashCard"><div class="c2row"><h2>${x.billId}</h2><span class="c2price">${c2money(x.amount)}</span></div><p>${hbe(x.status)}<br>${x.source==='app'?'App collection':'Hospital-direct receipt'} · ${new Date(x.at).toLocaleDateString('en-IN')}</p>${x.status==='Pending verification'?`<button class="c2btn c2secondary" onclick="c21verifyBenefit('${x.id}')">Demo: verify bill / eligibility</button>`:x.status==='Verified · demo credit'?`<button class="c2btn" onclick="c21claimBenefit('${x.id}')">Claim demo credit</button>`:'<span class="c2tag green">Claim recorded · no actual payout</span>'}</div>`).join(''):'<div class="c21empty">No bill benefits yet.<br>Scan a sample bill or submit a hospital-direct receipt.</div>'}<button class="c2btn c2secondary" onclick="c21directPage()">Already paid at hospital? Submit receipt</button><button class="c2tools" onclick="c21model()">How hospital collection & verification works</button>`,'',{route:'cashback'})}
function c21verifyBenefit(id){const x=C2.benefits.find(x=>x.id===id);if(!x||x.status!=='Pending verification')return;const paid=C2.billPayments.find(p=>p.id===x.sourceId&&p.status==='Paid · simulated');const direct=C2.directClaims.find(c=>c.id===x.sourceId&&c.status==='Hospital confirmed · demo');if(x.source==='app'&&!paid||x.source==='hospital_direct'&&!direct)return toast('Hospital must confirm the direct-paid receipt before eligibility review.');x.status='Verified · demo credit';x.verifiedAt=new Date().toISOString();c2save();c21cashback()}
function c21claimBenefit(id){const x=C2.benefits.find(x=>x.id===id);if(!x||x.status!=='Verified · demo credit')return;x.status='Claimed · simulated';x.claimRef=c2id('BENEFITCLAIM-DEMO');x.claimedAt=new Date().toISOString();c2save();c21cashback()}
function c21directPage(id=''){C21directDraft={billId:id,proof:null};c2page('Paid directly at hospital',`<form id="c21directForm"><label class="c2label" for="c21hospitalBill">Hospital sample invoice</label><select class="c2input" id="c21hospitalBill">${C21BILLS.map(b=>`<option value="${b.id}" ${b.id===id?'selected':''}>${b.hospital} · ${b.invoice}</option>`).join('')}</select><label class="c2label" for="c21paidAmount">Amount actually paid · INR</label><input id="c21paidAmount" class="c2input" type="number" min="0.01" max="1000000" step="0.01" required placeholder="As shown on your receipt"><label class="c2label" for="c21receiptRef">Hospital receipt / transaction reference</label><input id="c21receiptRef" class="c2input" required maxlength="80" placeholder="Receipt or transaction number"><label class="c2label" for="c21proof">Upload payment receipt</label><input type="file" id="c21proof" class="c21file" accept="image/jpeg,image/png,image/webp,application/pdf" required onchange="c21proofFile(this)"><p id="c21proofStatus" class="c21proof"></p><label class="c2check"><input id="c21receiptConsent" type="checkbox" required>I request receipt verification and understand it is not automatic proof of payment or cashback eligibility.</label><p id="c21directError" class="c2status" role="status"></p></form><div class="c2note">No payment is collected here. Hospital confirmation or reconciliation is needed. Only file metadata is retained in this demo.</div>`,`<button class="c2btn" onclick="c21submitDirect()">Submit receipt · no payment</button>`,{active:'qr',back:'c21scan()'})}
function c21proofFile(input){const f=input.files?.[0];C21directDraft.proof=null;if(!f)return;if(!['image/jpeg','image/png','image/webp','application/pdf'].includes(f.type)||f.size>10*1024*1024){input.value='';c2get('c21proofStatus').textContent='Choose a supported image/PDF up to 10 MB.';return}C21directDraft.proof={name:f.name,size:f.size,type:f.type};c2get('c21proofStatus').textContent=f.name+' · metadata only'}
function c21submitDirect(){if(!c2get('c21directForm').reportValidity())return;const b=C21BILLS.find(b=>b.id===c2get('c21hospitalBill').value),amount=Number(c2get('c21paidAmount').value),ref=c2get('c21receiptRef').value.trim(),proof=C21directDraft.proof;if(!proof||!ref||!Number.isFinite(amount)||amount<=0)return c2get('c21directError').textContent='Enter amount, receipt reference and a valid receipt file.';if(C2.billPayments.some(p=>p.billId===b.id&&p.status==='Paid · simulated'))return c2get('c21directError').textContent='This sample bill is already paid in the app. Do not submit it as another collection.';if(C2.directClaims.some(c=>c.billId===b.id)||C2.directClaims.some(c=>c.hospitalId===b.hospitalId&&c.receiptRef.toLowerCase()===ref.toLowerCase()))return c2get('c21directError').textContent='A receipt for this bill/reference is already submitted.';const c={id:c2id('DIRECT-DEMO'),billId:b.id,hospitalId:b.hospitalId,hospital:b.hospital,invoice:b.invoice,amount:Math.round(amount*100)/100,receiptRef:ref,proof,status:'Awaiting hospital confirmation',collection:'Hospital-direct · customer reported',at:new Date().toISOString()};C2.directClaims.push(c);c21pendingBenefit(b.id,c.id,'hospital_direct');c2save();c21directDetail(c.id)}
function c21directDetail(id){const c=C2.directClaims.find(c=>c.id===id);if(!c)return c21cashback();c2page('Receipt verification',`<div class="c2card"><span class="c2tag">${hbe(c.status)}</span><h2 style="margin-top:12px">${hbe(c.hospital)}</h2><p>Bill ${hbe(c.invoice)}<br>Receipt ${hbe(c.receiptRef)}<br>Customer-reported paid amount: ${c2money(c.amount)}</p><p>File: ${hbe(c.proof.name)} · metadata only<br>Collection: hospital-direct, not app collection.</p></div><div class="c2note">${c.status==='Hospital confirmed · demo'?'Sample hospital confirmation was recorded. No bank payment or database check actually occurred.':'A customer receipt alone is not independent confirmation. Hospital must confirm the bill/reference/paid amount through a small portal or reconciliation CSV.'}</div>${c.status==='Awaiting hospital confirmation'?`<button class="c2btn c2secondary" onclick="c21confirmDirect('${c.id}')">Demo: hospital confirms this receipt</button>`:''}<button class="c2btn c2secondary" onclick="c21cashback()">View benefit review status</button>`,'',{active:'qr',back:'c21cashback()'})}
function c21confirmDirect(id){const c=C2.directClaims.find(c=>c.id===id);if(!c||c.status!=='Awaiting hospital confirmation')return;c.status='Hospital confirmed · demo';c.confirmedAmount=c.amount;c.confirmedAt=new Date().toISOString();c2save();c21directDetail(id)}
function c21model(){c2page('Hospital payment model',`<div class="c2card"><h2>1. Bill-linked app payment</h2><p>Hospital creates/validates invoice → QR identifies bill → customer sees verified payable → approved provider confirms payment → linked hospital settlement.</p></div><div class="c2card"><h2>2. Hospital-direct payment</h2><p>Customer pays hospital → receipt submitted → hospital confirms receipt/amount → direct-collection ledger → benefit review. No second app charge or hospital principal payout.</p></div><div class="c2card"><h2>3. Minimal hospital cooperation</h2><p>A small confirmation portal, secure bill upload or daily CSV can work without HIS database access. Without any confirmation/data, exact collections and revenue share cannot be independently tracked.</p></div><div class="c2note">Cashback is a customer benefit after verification, not something the hospital claims instead of settling a bill. No commission percentage or live cashback eligibility is configured here.</div>`,'',{back:'c21cashback()'})}
// Keep the camera off when leaving the tab or closing the preview.
document.addEventListener('visibilitychange',()=>{if(document.hidden)c21stopScan()});window.addEventListener('beforeunload',c21stopScan);
home();
</script><style>.c22filters{border:1px solid #e9eef5;border-radius:16px;padding:12px;margin-bottom:12px}.c22filters .c2label{margin-top:0}.c22filterRow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px}.c22filterRow input{min-width:0;width:100%;font-size:11px;padding:10px 7px}.c22filterActions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:11px}.c22filterActions .c2btn{font-size:10px;padding:9px;min-height:34px;margin:0}.c22exports{display:grid;grid-template-columns:1fr 1fr;gap:8px}.c22exports button{border:1px solid #e5ebf3;background:white;border-radius:13px;padding:11px;display:flex;justify-content:center;align-items:center;gap:9px;font-size:11px;font-weight:650;min-height:43px;color:#556b8a}.c22exports svg{width:22px;height:24px}.c22exports button:first-child svg{color:#d57d83}.c22exports button:last-child svg{color:#55a78e}.c22exports button:disabled{opacity:.4}.c22summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0}.c22summary>div{background:#f5f8fc;border-radius:12px;padding:10px 5px;text-align:center}.c22summary b{display:block;font-size:15px;color:#5271a2}.c22summary small{display:block;font-size:8px;color:#94a2b5;margin-top:4px}.c22reportRow{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #edf1f7}.c22reportRow .grow{min-width:0}.c22reportRow b{display:block;font-size:11px}.c22reportRow small{display:block;font-size:9px;line-height:1.5;color:#91a0b4;margin-top:4px;overflow-wrap:anywhere}.c22reportRow>div:last-child{text-align:right;flex-shrink:0}.c22reportRow>div:last-child b{color:#617b9f}.c22downloadLinks{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:8px}.c22downloadLinks a{font-size:10px;color:#426dff;text-decoration:underline}.c22count{font-size:9px;color:#9ba7b7}.c22exportError{margin:8px 0 0;font-size:10px;color:#c47881;line-height:1.4}.c22profileIcon{height:34px;width:34px;border-radius:11px;background:#eff4ff;color:#7694c </style><script>/* Reports: created-date and service filters; real offline PDF and XLSX exports. */
const C22={from:'',to:'',service:'all',rows:[],links:{}};
const C22labels={online:'Online consultation',ambulance:'Ambulance',pharmacy:'Pharmacy',labs:'Home lab',doctor:'Physician',offers:'Offers & camps',packages:'Health packages',billpay:'Hospital QR bill',direct:'Hospital-direct receipt',cashback:'Cashback benefit'};
const c22profile=profile;profile=function(){c22profile();const body=document.querySelector('.c2body');if(!body||!C2.loggedIn)return;const b=document.createElement('button');b.className='c2choice';b.id='c22profileReports';b.onclick=c22reports;b.innerHTML=`<span class="c22profileIcon">${hbSvg('records')}</span><div class="grow"><b>Reports & downloads</b><small>Date-wise / service-wise · PDF & Excel</small></div><span>›</span>`;body.querySelector('.c2card')?.after(b)};
function c22localDate(value){if(!value)return '';const d=new Date(value);if(!Number.isFinite(d.getTime()))return '';return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function c22number(value){if(value===null||value===undefined||value==='')return null;const n=Number(value);return Number.isFinite(n)?n:null}
function c22allRows(){const orders=C2.orders.map(o=>({id:o.id,date:c22localDate(o.createdAt),created:o.createdAt||'',service:o.type,title:c2title(o),hospital:o.hospital||'',patient:o.patient||'',status:c2stage(o),payment:o.paymentStatus||'Not requested',amount:c22number(o.amount),channel:o.type==='billpay'?'App QR collection':'Service request',reference:o.paymentRef||o.billRef||'',bill:o.billId||'',kind:'Order'}));const direct=C2.directClaims.map(c=>({id:c.id,date:c22localDate(c.at),created:c.at,service:'direct',title:'Hospital-direct receipt',hospital:c.hospital||'',patient:C2.user?.name||'',status:c.status,payment:c.status==='Hospital confirmed · demo'?'Hospital-direct confirmed · demo':'Hospital-direct customer reported',amount:c22number(c.amount),channel:'Hospital-direct · not company collection',reference:c.receiptRef||'',bill:c.billId||'',kind:'Receipt'}));const benefits=C2.benefits.map(x=>({id:x.id,date:c22localDate(x.at),created:x.at,service:'cashback',title:'Cashback benefit · demo',hospital:C21BILLS.find(b=>b.id===x.billId)?.hospital||'',patient:C2.user?.name||'',status:x.status,payment:x.status==='Claimed · simulated'?'Claim recorded · no real payout':'No real cash transfer',amount:c22number(x.amount),channel:'Benefit ledger · not service collection',reference:x.claimRef||'',bill:x.billId||'',kind:'Benefit'}));return [...orders,...direct,...benefits].sort((a,b)=>(b.created||'').localeCompare(a.created||''))}

function c22exportPDF(){if(!c22apply()||!C22.rows.length)return;try{const pages=[];let ctx,y;const width=1190,height=1684,left=65,right=1125,bottom=1550;function newPage(){const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;ctx=canvas.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,width,height);ctx.fillStyle='#426dff';ctx.fillRect(0,0,width,8);ctx.font='600 30px system-ui';ctx.fillStyle='#263d5c';ctx.fillText('HealthBasket | Customer report',left,70);ctx.fillStyle='#90a0b5';ctx.font='18px system-ui';ctx.fillText('DEMO EXPORT — not a bank statement or clinical report',left,108);ctx.fillText('Created-date filter: '+(C22.from||'All dates')+' to '+(C22.to||'All dates'),left,141);ctx.fillText('Service: '+(C22.service==='all'?'All services & records':C22labels[C22.service])+' | Records: '+C22.rows.length,left,172);y=225;pages.push(canvas)}function line(text,bold=false){const font=(bold?'600 24':'21')+'px system-ui';ctx.font=font;const words=String(text).split(/\s+/);let buffer='';const flush=()=>{if(y>bottom)newPage();ctx.font=font;ctx.fillStyle=bold?'#36547c':'#6b7f9b';ctx.fillText(buffer,left,y);y+=bold?36:31;buffer=''};for(const word of words){if(ctx.measureText((buffer?buffer+' ':'')+word).width>right-left&&buffer)flush();if(ctx.measureText(word).width>right-left){for(const ch of word){if(ctx.measureText(buffer+ch).width>right-left)flush();buffer+=ch}}else buffer+=(buffer?' ':'')+word}if(buffer)flush()}
