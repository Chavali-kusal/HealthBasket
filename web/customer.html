c2privacy=function(){c2page('Privacy & shared database',`<div class="c2card"><h2>One common database</h2><p>Requests, trip status, payment simulations, claims and prescription bytes are stored in local SQLite through the API.</p></div><div class="c2card"><h2>Role-scoped access</h2><p>The API scopes customer records, hospital requests and driver trips to the signed-in account. Demo passwords/OTP are public; this is not production identity verification.</p></div><div class="c2card"><h2>Prescription access</h2><p>The selected hospital can open the saved photo/PDF after your upload. Upload only invented test information. Production needs encrypted storage, verified identity, retention/deletion and file-security controls.</p></div><div class="c2note">Payments, cashback, WhatsApp and live dispatch remain demonstrations. Clearing browser preferences does not delete the shared database.</div>`,'',{active:'profile',back:'profile()'})};
const hbcScheduleControls=hbcControls;hbcControls=function(){hbcScheduleControls();const o=c2o();if(C2route!=='detail'||!o)return;const body=document.querySelector('.c2body');if(!body)return;if(!body.querySelector('.hbRoutingNotice')){const el=document.createElement('div');el.className='c2note hbRoutingNotice';el.textContent='Sent to: '+o.hospital+' · '+(o.hospitalId||'')+'. Only this hospital’s staff account can accept this request.';body.querySelector('.c2card')?.after(el)}if(o.type!=='online'||!o.confirmedDate||body.querySelector('.hbAppointment'))return;const pending=o.scheduleNeedsAcceptance&&!o.scheduleAccepted;const box=document.createElement('div');box.className='c2card hbAppointment';box.innerHTML=`<span class="c2tag">${pending?'HOSPITAL PROPOSED A REVISED SLOT':'HOSPITAL-CONFIRMED APPOINTMENT'}</span><h2 style="margin-top:12px">${hbe(o.doctor)}</h2><p>${hbe(o.confirmedDate)} · ${hbe(o.slot)} IST</p><p>Originally requested: ${hbe(o.requestedDate||'')} · ${hbe(o.requestedSlot||'')}</p>${pending?`<button class="c2btn" onclick="hbcAcceptSchedule('${o.id}',${o.scheduleRevision})">Accept hospital schedule</button><p class="c2thin">Please review this date/time before payment. If unsuitable, contact the hospital or cancel before service.</p>`:'<span class="c2tag green">'+(o.scheduleNeedsAcceptance?'Accepted by you':'Matches your requested slot')+'</span>'}`;body.querySelector('.hbRoutingNotice')?.after(box);if(pending)body.querySelectorAll('button').forEach(b=>{if(b.textContent.trim().startsWith('Pay company'))b.hidden=true})};
async function hbcAcceptSchedule(id,revision){try{hbcApply(await HB.action('accept_schedule',id,{scheduleRevision:revision}));c2detail(id)}catch(e){toast(e.message)}}


const HB_TERMS='2026-10-v1';
function hbTermsHTML(){return `<div class="c2card"><h2>Cancellation & refund terms</h2><p>Completed services and issued clinical reports cannot be cancelled. Before completion, request cancellation; hospital/company approval is required before a refund can be claimed.</p><p>Company verification/review may take up to 48 hours from your request. This is a review target, not a promise of bank credit within 48 hours. Bank/gateway processing can take additional working days.</p><p>Original-source refund is the default choice. Discount credit is optional, usable only inside this demo; no cash withdrawal. Bank transfer requires separate secure beneficiary verification. No cancellation charge is enabled.</p><label class="c2label"><input id="hbPaymentTerms" type="checkbox"> I have read and accept these terms (${HB_TERMS}).</label></div>`}
const hbcCheckout=c2pay;c2pay=function(id,context){hbcCheckout(id,context);const body=document.querySelector('.c2body');if(!body||!C2payment)return;body.insertAdjacentHTML('beforeend',hbTermsHTML());const balance=(C2.discountCredits||[]).reduce((n,c)=>n+Number(c.remaining||0),0);if(balance>0)body.insertAdjacentHTML('beforeend',`<div class="c2card"><b>Available discount credit: ${c2money(balance)}</b><label class="c2label"><input id="hbUseDiscount" type="checkbox"> Apply up to ${c2money(Math.min(balance,C2.orders.find(o=>o.id===id).amount))} to this payment (demo).</label></div>`)};
c2paymentResult=async function(result){if(C2busy||!C2payment)return;if(!document.getElementById('hbPaymentTerms')?.checked)return c2status('Accept the cancellation/refund terms before payment.');C2busy=true;const p={...C2payment};try{hbcApply(await HB.action('pay_demo',p.id,{context:p.context,result,method:c2get('c2payMethod')?.value||'UPI · simulated',termsAccepted:true,termsVersion:HB_TERMS,useDiscount:document.getElementById('hbUseDiscount')?.checked===true}));if(result==='success'){C2payment=null;c2detail(p.id)}else{c2pay(p.id,p.context);c2status(result==='failed'?'Nothing charged. Retry when ready.':'Pending payment is unverified.')}}catch(e){c2status(e.message)}finally{C2busy=false}};
const hbBillPage=c21billDetail;c21billDetail=function(id){hbBillPage(id);const body=document.querySelector('.c2body');if(body&&!body.querySelector('#hbPaymentTerms'))body.insertAdjacentHTML('beforeend',hbTermsHTML())};
c21payBill=async function(){const b=C21bill;if(!b||C21busy)return;if(!c2get('c21notPaid')?.checked||!document.getElementById('hbPaymentTerms')?.checked)return toast('Confirm unpaid bill and accept refund terms.');C21busy=true;try{hbcApply(await HB.action('sample_bill_pay',b.id,{termsAccepted:true,termsVersion:HB_TERMS}));c21billDetail(b.id)}catch(e){toast(e.message)}finally{C21busy=false}};
const hbcServiceDetail=c2detail;c2detail=function(id){hbcServiceDetail(id);const o=C2.orders.find(x=>x.id===id),body=document.querySelector('.c2body');if(!o||!body)return;
const heading=[...body.querySelectorAll('.c2section')].find(n=>n.textContent.includes('Recent activity'));if(heading){let n=heading.nextElementSibling;while(n?.classList.contains('c2line')){const next=n.nextElementSibling;n.remove();n=next}const d=document.createElement('details');d.className='c2card hbCustomerHistory';d.innerHTML=`<summary style="cursor:pointer;font-weight:700">Request & payment history · ${(o.history||[]).length} updates</summary><div>${(o.history||[]).slice().reverse().map(e=>`<div class="c2line done"><i>✓</i><div><b>${hbe(e.text||e.title)}</b><small>${new Date(e.at).toLocaleString('en-IN',{timeZone:'Asia/Kolkata'})}</small></div></div>`).join('')}</div>`;heading.replaceWith(d)}
body.querySelectorAll('button').forEach(b=>{if(b.textContent.includes('Demo: confirm refund completion')||b.textContent.trim()==='Cancel this request')b.hidden=true});
if(!['completed','cancelled'].includes(o.stage)&&!o.clinicalRecords?.length&&o.type!=='billpay'&&o.cancellationStatus!=='Pending approval'){const b=document.createElement('button');b.className='c2btn c2secondary';b.textContent='Request service cancellation';b.onclick=()=>hbcCancellation(id);body.querySelector('.hbCustomerHistory')?.before(b)}
if(o.cancellationStatus){const box=document.createElement('div');box.className='c2card';box.innerHTML=`<h2>Cancellation ${hbe(o.cancellationStatus)}</h2><p>${hbe(o.cancellationReason||o.cancelReason||'')}<br>${hbe(o.cancellationDecisionNote||'Hospital/company verification may take up to 48 hours. Refund claim appears only after approval.')}</p>`;body.querySelector('.hbCustomerHistory')?.before(box)}
if(o.refundStatus){const box=document.createElement('div');box.className='c2card';box.innerHTML=`<h2>Refund tracking</h2><p>${hbe(o.refundStatus)}<br>${c2money(o.refundAmount??o.amount)} · ${hbe(o.refundId||o.id)}</p>${o.refundStatus==='Eligible to claim'&&o.cancellationStatus==='Approved'?`<button class="c2btn" onclick="hbcRefundClaim('${id}')">Claim approved refund</button>`:''}<small>${hbe(o.refundMethod||'')} · ${o.refundMethod==='bank'?'Secure beneficiary verification required. ':''}No live bank transfer in this demo.</small>`;body.querySelector('.hbCustomerHistory')?.before(box)}
if(o.discountApplied){const p=document.createElement('p');p.className='c2note';p.textContent='Discount used: '+c2money(o.discountApplied)+' · Company collection: '+c2money(o.companyCollected||0);body.querySelector('.hbCustomerHistory')?.before(p)}
};
function hbcCancellation(id){const o=C2.orders.find(x=>x.id===id);if(!o||['completed','cancelled'].includes(o.stage)||o.clinicalRecords?.length)return;const paid=['Paid · simulated','Cash received · simulated'].includes(o.paymentStatus);c2page('Request cancellation',`<div class="c2card"><h2>${hbe(c2title(o))}</h2><p>${hbe(o.hospital)}<br>${hbe(o.id)}</p><b>${paid?'Payment recorded: '+c2money(o.companyCollected??o.amount):'No verified payment collected'}</b></div><label class="c2label" for="hbCancelReason">Reason</label><textarea id="hbCancelReason" class="c2input" maxlength="300" placeholder="Why do you want to cancel?"></textarea><p class="c2note">This sends a request; service is not cancelled until approval. Hospital/company verification target: 48 hours. Refund claim is available only after approval. Completed services cannot be cancelled. Bank processing may take additional working days.</p><p class="c2status" id="hbCancelError" role="status"></p>`,`<button class="c2btn" onclick="hbcSubmitCancellation('${id}')">Send cancellation request</button>`,{active:'bookings',route:'cancelService',back:`c2detail('${id}')`})}
async function hbcSubmitCancellation(id){const reason=document.getElementById('hbCancelReason').value.trim();if(!reason){document.getElementById('hbCancelError').textContent='Enter a reason.';return}try{hbcApply(await HB.action('cancel_request',id,{reason}));c2detail(id)}catch(e){document.getElementById('hbCancelError').textContent=e.message}}
c2cancel=hbcCancellation;
function hbcRefundClaim(id){const o=C2.orders.find(x=>x.id===id);if(!o||o.cancellationStatus!=='Approved'||o.refundStatus!=='Eligible to claim')return;c2page('Claim approved refund',`<div class="c2card"><h2>${c2money(o.refundAmount)}</h2><p>${hbe(o.refundId)}</p></div><label class="c2label" for="hbRefundMethod">Choose your preference</label><select id="hbRefundMethod" class="c2input" onchange="document.getElementById('hbBankFields').hidden=this.value!=='bank'"><option value="original">Original payment method (recommended)</option><option value="discount">App discount credit · voluntary</option><option value="bank">Bank transfer · secure verification needed</option></select><div id="hbBankFields" hidden><p class="c2note">Demo: use sample information and LAST 4 digits only. Full bank details are not collected here. Production needs a verified encrypted/hosted beneficiary flow.</p><label class="c2label">Sample account holder</label><input class="c2input" id="hbBankHolder" maxlength="80"><label class="c2label">IFSC</label><input class="c2input" id="hbBankIfsc" maxlength="11"><label class="c2label">Last 4 account digits only</label><input class="c2input" id="hbBankLast4" maxlength="4" inputmode="numeric"></div><p class="c2note">Company finance reviews your claim. Original-source refund usually needs no new bank details. Discount credit cannot be withdrawn as cash. Bank refund availability and timing depend on verification and provider rules.</p><label class="c2label"><input type="checkbox" id="hbRefundConsent"> I explicitly choose this method and accept the processing terms.</label><p id="hbRefundError" class="c2status"></p>`,`<button class="c2btn" onclick="hbcSendRefundClaim('${id}')">Submit refund claim</button>`,{active:'bookings',route:'refundClaim',back:`c2detail('${id}')`})}
async function hbcSendRefundClaim(id){try{hbcApply(await HB.action('refund_claim',id,{method:document.getElementById('hbRefundMethod').value,consent:document.getElementById('hbRefundConsent').checked,holder:document.getElementById('hbBankHolder').value,ifsc:document.getElementById('hbBankIfsc').value,last4:document.getElementById('hbBankLast4').value}));c2detail(id)}catch(e){document.getElementById('hbRefundError').textContent=e.message}}
let HBRecordsFilter='all';records=function(filter=HBRecordsFilter){HBRecordsFilter=filter;C2route='records';const rows=C2.orders.flatMap(o=>[...(o.rx?[{...o.rx,kind:'upload',order:o}]:[]),...(o.clinicalRecords||[]).map(d=>({...d,order:o})),...(o.paymentRef?[{kind:'payment',name:'Payment summary',order:o}]:[]),...(o.cancellationStatus?[{kind:'cancellation',name:'Cancellation / refund history',order:o}]:[])]);const selected=rows.filter(d=>filter==='all'||d.kind===filter);c2page('Your records',`<div class="c2card"><h2>Discount credit: ${c2money((C2.discountCredits||[]).reduce((n,c)=>n+Number(c.remaining||0),0))}</h2><p>Voluntary refund credits, applied only when you choose at checkout. Separate from cashback.</p></div><div class="c2card"><h2>Documents & transactions</h2><p>Hospital-issued reports, uploaded prescriptions, payment summaries and cancellation history. A payment summary is not a clinical report.</p></div><label class="c2label">Record type</label><select class="c2input" onchange="records(this.value)">${[['all','All records'],['report','Hospital reports'],['prescription','Hospital prescriptions'],['discharge','Discharge summaries'],['upload','Your uploads'],['payment','Payment summaries'],['cancellation','Cancellation / refunds']].map(([v,t])=>`<option value="${v}" ${v===filter?'selected':''}>${t}</option>`).join('')}</select>${selected.map(d=>`<button class="c2choice" onclick="${d.documentId?`hbOpenRecord('${d.documentId}')`:`c2detail('${d.order.id}')`}"><div class="grow"><b>${hbe(d.name)}</b><small>${hbe(d.order.hospital)} · ${hbe(d.order.id)}<br>${hbe(d.kind)} · ${hbe(new Date(d.createdAt||d.order.paidAt||d.order.createdAt).toLocaleString('en-IN',{timeZone:'Asia/Kolkata'}))}</small></div><span>›</span></button>`).join('')||'<div class="c2empty">No records in this category yet. Hospital reports appear after staff publish them following service completion.</div>'}`,'',{active:'records',route:'records'});};
let hbRecordURL=null;async function hbOpenRecord(id){try{const response=await fetch('/api/documents/'+encodeURIComponent(id),{headers:{Authorization:'Bearer '+HB.token}});if(!response.ok)throw Error('Document unavailable or access denied.');const blob=await response.blob();if(hbRecordURL)URL.revokeObjectURL(hbRecordURL);hbRecordURL=URL.createObjectURL(blob);c2page('Document',blob.type==='application/pdf'?`<iframe title="Clinical document" src="${hbRecordURL}" style="width:100%;height:50dvh;border:0"></iframe>`:`<img alt="Saved healthcare document" src="${hbRecordURL}" style="width:100%;object-fit:contain">`,`<a class="c2btn" href="${hbRecordURL}" download="HealthBasket_document.${blob.type==='application/pdf'?'pdf':'image'}">Download document</a>`,{active:'records',back:'records()'})}catch(e){toast(e.message)}}
